<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>换乘恋爱 × SEVENTEEN</title>
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
  background: linear-gradient(135deg, #fce4ec 0%, #f8e8e8 30%, #fff5f5 60%, #fce4ec 100%);
  min-height: 100vh;
  color: #3d2c2c;
  line-height: 1.7;
  -webkit-tap-highlight-color: transparent;
}

.hidden { display: none !important; }

#app {
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 12px 40px;
}

/* ==================== Header ==================== */
.header {
  background: #fff;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 10px rgba(180, 120, 120, 0.08);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
}

.header .day-badge {
  background: linear-gradient(135deg, #e91e63, #f06292);
  color: #fff;
  padding: 5px 12px;
  border-radius: 18px;
  font-weight: 700;
  font-size: 13px;
  white-space: nowrap;
}

.header .phase-tag {
  color: #c2185b;
  font-weight: 600;
  font-size: 12px;
}

.header .affection-hint {
  font-size: 11px;
  color: #8b6b6b;
  background: #fff5f5;
  padding: 3px 8px;
  border-radius: 10px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
  flex-shrink: 1;
  cursor: pointer;
}

.header .affection-hint:hover { background: #fce4ec; }

.header .header-btns {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.header .header-btns button {
  padding: 5px 10px;
  border-radius: 12px;
  border: 1px solid #e0c0c0;
  background: #fff5f5;
  color: #8b3a3a;
  cursor: pointer;
  font-size: 11px;
  transition: all .2s;
}

.header .header-btns button:hover {
  background: #fce4ec;
  border-color: #e91e63;
}

/* ==================== Memory Review Panel (非模态可折叠) ==================== */
.memory-review-panel {
  background: #fff;
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 10px;
  box-shadow: 0 2px 10px rgba(180, 120, 120, 0.06);
  border-left: 3px solid #e91e63;
}

.memory-review-panel .mr-toggle {
  cursor: pointer;
  font-weight: 600;
  color: #c2185b;
  font-size: 13px;
  user-select: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.memory-review-panel .mr-toggle .mr-status {
  font-size: 11px;
  color: #e65100;
  font-weight: 700;
}

.memory-review-panel .mr-body {
  margin-top: 8px;
}

.memory-review-panel .mr-body textarea {
  width: 100%;
  min-height: 200px;
  border: 1.5px solid #e0c0c0;
  border-radius: 10px;
  padding: 10px;
  font-size: 12px;
  line-height: 1.7;
  font-family: inherit;
  resize: vertical;
  outline: none;
}

.memory-review-panel .mr-body textarea:focus { border-color: #e91e63; }

.memory-review-panel .mr-actions {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.memory-review-panel .mr-actions button {
  flex: 1;
  padding: 8px;
  border-radius: 16px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
}

.memory-review-panel .btn-mr-recompress {
  background: #f3e5f5;
  color: #7b3f8b;
  border: 1px solid #d0b0d0;
}

.memory-review-panel .btn-mr-confirm {
  background: linear-gradient(135deg, #43a047, #66bb6a);
  color: #fff;
}

/* ==================== Cards ==================== */
.card {
  background: #fff;
  border-radius: 14px;
  padding: 14px 16px;
  margin-bottom: 10px;
  box-shadow: 0 2px 10px rgba(180, 120, 120, 0.06);
}

/* ==================== Narrative Box ==================== */
.narrative-box {
  max-height: 420px;
  overflow-y: auto;
  padding-right: 4px;
  scroll-behavior: smooth;
  font-size: 14px;
  line-height: 1.85;
}

.narrative-box p { margin-bottom: 8px; }

.narrative-box .separator {
  text-align: center;
  color: #c0a0a0;
  margin: 12px 0;
  font-size: 11px;
  letter-spacing: 3px;
}

.narrative-box .separator::before { content: '· · ·'; }

/* ==================== Special Elements ==================== */
.narrative-box .director-os {
  color: #8b3a8b;
  background: #f9f0f9;
  border-left: 3px solid #c090c0;
  padding: 7px 10px;
  margin: 7px 0;
  border-radius: 0 7px 7px 0;
  font-style: normal;
  font-size: 13px;
}

.narrative-box .observer-os {
  color: #b8860b;
  background: #fef9e7;
  border-left: 3px solid #d4a017;
  padding: 7px 10px;
  margin: 7px 0;
  border-radius: 0 7px 7px 0;
  font-style: normal;
  font-size: 13px;
}

.narrative-box .observer-os .obs-name {
  font-weight: 700;
  color: #8b6914;
}

.narrative-box .interview {
  color: #5a4a8b;
  background: #f5f0fa;
  border-left: 3px solid #8b7ab8;
  padding: 7px 10px;
  margin: 7px 0;
  border-radius: 0 7px 7px 0;
  font-style: normal;
  font-size: 13px;
}

.narrative-box .x-interview {
  color: #c2185b;
  background: #fff0f3;
  border-left: 3px solid #e91e63;
  padding: 7px 10px;
  margin: 7px 0;
  border-radius: 0 7px 7px 0;
  font-style: normal;
  font-size: 13px;
}

.narrative-box .member-interview {
  color: #4a6b8b;
  background: #f0f4fa;
  border-left: 3px solid #6b8ab8;
  padding: 7px 10px;
  margin: 7px 0;
  border-radius: 0 7px 7px 0;
  font-style: normal;
  font-size: 13px;
}

/* ==================== Options ==================== */
.options-area { margin-top: 8px; }

.option-btn {
  display: block;
  width: 100%;
  text-align: left;
  padding: 11px 14px;
  margin: 5px 0;
  background: linear-gradient(135deg, #fff5f5, #fce4ec);
  border: 1.5px solid #e8c8c8;
  border-radius: 10px;
  cursor: pointer;
  font-size: 13px;
  color: #5d3a3a;
  transition: all .2s;
  font-weight: 500;
  -webkit-appearance: none;
}

.option-btn:hover {
  background: linear-gradient(135deg, #fce4ec, #f8d0d8);
  border-color: #e91e63;
  transform: translateX(2px);
  box-shadow: 0 2px 6px rgba(233, 30, 99, 0.10);
}

.option-btn:active { transform: scale(0.98); }
.option-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

.option-btn .opt-label {
  display: inline-block;
  background: #e91e63;
  color: #fff;
  padding: 2px 7px;
  border-radius: 8px;
  font-size: 10px;
  margin-right: 6px;
  font-weight: 700;
}

.option-btn.btn-special {
  background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
  border-color: #66bb6a;
  color: #2e7d32;
  font-weight: 700;
  text-align: center;
}

.option-btn.btn-special:hover {
  background: linear-gradient(135deg, #c8e6c9, #a5d6a7);
  border-color: #43a047;
}

/* ==================== Action Bar ==================== */
.action-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px dashed #e8d0d0;
}

.action-bar button {
  padding: 9px 14px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .2s;
  white-space: nowrap;
  -webkit-appearance: none;
}

.action-bar button:active { transform: scale(0.96); }

.btn-regenerate {
  background: #f3e5f5;
  color: #7b3f8b;
  border: 1px solid #d0b0d0;
}

.btn-regenerate:hover { background: #e8d0f0; }

.btn-skip {
  background: #e8f5e9;
  color: #2e7d32;
  border: 1px solid #a5d6a7;
}

.btn-skip:hover { background: #c8e6c9; }

.btn-sms {
  background: linear-gradient(135deg, #f06292, #e91e63);
  color: #fff;
  font-size: 13px;
  animation: pulse-sms 2s infinite;
}

.btn-sms:hover {
  transform: scale(1.03);
  box-shadow: 0 3px 12px rgba(233, 30, 99, 0.25);
}

.btn-sms:disabled {
  background: #ccc;
  animation: none;
  cursor: not-allowed;
  transform: none;
}

@keyframes pulse-sms {
  0%, 100% { box-shadow: 0 0 0 0 rgba(233, 30, 99, 0.3); }
  50% { box-shadow: 0 0 0 6px rgba(233, 30, 99, 0); }
}

.btn-next-day {
  background: linear-gradient(135deg, #43a047, #66bb6a);
  color: #fff;
}

.btn-next-day:hover { transform: scale(1.02); }

.btn-continue {
  background: #fff3e0;
  color: #e65100;
  border: 1px solid #ffcc80;
}

.btn-continue:hover { background: #ffe0b2; }

/* ==================== Free Input ==================== */
.free-input-area {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.free-input-area input {
  flex: 1;
  padding: 9px 12px;
  border-radius: 18px;
  border: 1.5px solid #e8c8c8;
  font-size: 12px;
  outline: none;
  transition: border .2s;
}

.free-input-area input:focus { border-color: #e91e63; }

.free-input-area button {
  padding: 9px 12px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  -webkit-appearance: none;
}

.btn-save-input { background: #f3e5f5; color: #7b3f8b; }

.btn-act-input {
  background: linear-gradient(135deg, #f06292, #e91e63);
  color: #fff;
}

/* ==================== Modal ==================== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn .2s;
}

.modal-content {
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  max-width: 95vw;
  width: 460px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 6px 30px rgba(0, 0, 0, 0.2);
  animation: slideUp .25s;
}

.modal-content h3 {
  color: #c2185b;
  margin-bottom: 12px;
  font-size: 16px;
}

.modal-content .x-member-name {
  color: #e91e63;
  font-weight: 700;
}

.modal-content p {
  margin-bottom: 7px;
  font-size: 13px;
  line-height: 1.7;
}

.modal-close {
  display: block;
  margin: 14px auto 0;
  padding: 7px 20px;
  border-radius: 14px;
  border: none;
  background: #fce4ec;
  color: #c2185b;
  cursor: pointer;
  font-weight: 600;
}

.modal-content textarea {
  width: 100%;
  min-height: 200px;
  border: 1.5px solid #e0c0c0;
  border-radius: 10px;
  padding: 10px;
  font-size: 13px;
  line-height: 1.7;
  font-family: inherit;
  resize: vertical;
  outline: none;
}

.modal-content textarea:focus { border-color: #e91e63; }

.modal-content .btn-confirm {
  display: block;
  width: 100%;
  padding: 10px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #43a047, #66bb6a);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}

.modal-content .btn-confirm:hover { transform: scale(1.01); }

.modal-content .btn-alt {
  display: block;
  width: 100%;
  padding: 8px;
  border-radius: 16px;
  border: 1.5px solid #e0c0c0;
  background: #fff;
  color: #8b6b6b;
  font-size: 12px;
  cursor: pointer;
  margin-top: 6px;
}

.modal-content .btn-copy {
  display: block;
  width: 100%;
  padding: 10px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #f06292, #e91e63);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 10px;
}

.modal-content .btn-copy:hover { transform: scale(1.01); }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

/* ==================== SMS Modal ==================== */
.sms-draft-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 10px;
}

.sms-draft-btn {
  padding: 12px;
  border-radius: 12px;
  border: 2px solid #e8c8c8;
  background: #fff5f5;
  cursor: pointer;
  font-size: 13px;
  color: #5d3a3a;
  transition: all .2s;
  text-align: left;
  line-height: 1.5;
}

.sms-draft-btn:hover {
  border-color: #e91e63;
  background: #fce4ec;
}

.sms-draft-btn.selected {
  border-color: #e91e63;
  background: #fce4ec;
  box-shadow: 0 0 0 2px rgba(233, 30, 99, 0.15);
}

.sms-custom-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1.5px solid #e0c0c0;
  font-size: 13px;
  outline: none;
  font-family: inherit;
  resize: vertical;
  min-height: 40px;
}

.sms-custom-input:focus { border-color: #e91e63; }

.sms-target-options {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-top: 8px;
}

.sms-target-btn {
  padding: 11px;
  border-radius: 12px;
  border: 2px solid #e8c8c8;
  background: #fff;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: #5d3a3a;
  transition: all .2s;
  text-align: center;
}

.sms-target-btn:hover {
  border-color: #e91e63;
  background: #fce4ec;
}

.sms-target-btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* ==================== Dice Modal ==================== */
.dice-area {
  text-align: center;
  padding: 16px 0;
}

.dice-box {
  width: 80px;
  height: 80px;
  margin: 0 auto 14px;
  background: linear-gradient(135deg, #fff5f5, #fce4ec);
  border: 3px solid #e91e63;
  border-radius: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
  font-weight: 900;
  color: #c2185b;
  transition: transform .3s;
}

.dice-box.rolling {
  animation: diceRoll .6s ease-in-out;
}

@keyframes diceRoll {
  0% { transform: rotate(0deg) scale(1); }
  25% { transform: rotate(90deg) scale(1.15); }
  50% { transform: rotate(180deg) scale(0.95); }
  75% { transform: rotate(270deg) scale(1.1); }
  100% { transform: rotate(360deg) scale(1); }
}

.dice-result {
  font-size: 15px;
  font-weight: 700;
  color: #c2185b;
  margin: 8px 0;
}

/* ==================== Affection Panel ==================== */
.aff-log-item {
  background: #fff5f5;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 6px;
  font-size: 12px;
  line-height: 1.6;
}

.aff-log-item .aff-change-pos { color: #2e7d32; font-weight: 700; }
.aff-log-item .aff-change-neg { color: #c62828; font-weight: 700; }
.aff-log-item .aff-total { color: #8b6b6b; font-size: 11px; }

/* ==================== History Tabs ==================== */
.history-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  margin-bottom: 10px;
}

.history-tabs button {
  padding: 5px 10px;
  border-radius: 12px;
  border: 1.5px solid #e0c0c0;
  background: #fff;
  cursor: pointer;
  font-size: 11px;
  font-weight: 600;
  color: #8b6b6b;
  transition: all .2s;
}

.history-tabs button.active {
  border-color: #e91e63;
  background: #fce4ec;
  color: #c2185b;
}

.history-content {
  max-height: 50vh;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.8;
}

/* ==================== Setup Wizard ==================== */
.setup-step {
  background: #fff;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 3px 16px rgba(180, 120, 120, 0.10);
  margin-bottom: 14px;
}

.setup-step h2 {
  color: #c2185b;
  margin-bottom: 4px;
  font-size: 18px;
}

.setup-step .step-desc {
  color: #8b6b6b;
  font-size: 12px;
  margin-bottom: 14px;
}

.setup-step label {
  display: block;
  font-weight: 600;
  color: #5d3a3a;
  margin: 8px 0 3px;
  font-size: 13px;
}

.setup-step input[type="text"],
.setup-step input[type="number"],
.setup-step input[type="password"] {
  width: 100%;
  padding: 9px 12px;
  border-radius: 8px;
  border: 1.5px solid #e0c0c0;
  font-size: 13px;
  outline: none;
}

.setup-step input:focus { border-color: #e91e63; }

.setup-step .member-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
  gap: 7px;
  margin: 7px 0;
}

.setup-step .member-chip {
  padding: 8px 4px;
  border-radius: 10px;
  border: 2px solid #e0c0c0;
  text-align: center;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  transition: all .2s;
  background: #fff;
  color: #5d3a3a;
  line-height: 1.4;
}

.setup-step .member-chip:hover {
  border-color: #e91e63;
  background: #fff5f5;
}

.setup-step .member-chip.selected {
  border-color: #e91e63;
  background: #fce4ec;
  color: #c2185b;
}

.setup-step .member-chip.x-marked {
  border-color: #ff5722;
  background: #fff0eb;
  color: #d84315;
  box-shadow: 0 0 0 2px rgba(255, 87, 34, 0.15);
}

.setup-step .btn-primary {
  display: block;
  width: 100%;
  padding: 12px;
  border-radius: 20px;
  border: none;
  background: linear-gradient(135deg, #e91e63, #f06292);
  color: #fff;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 14px;
  transition: all .2s;
}

.setup-step .btn-primary:hover {
  transform: scale(1.01);
  box-shadow: 0 3px 12px rgba(233, 30, 99, 0.25);
}

.setup-step .btn-primary:disabled {
  background: #ccc;
  cursor: not-allowed;
  transform: none;
}

.setup-step .btn-secondary {
  display: block;
  width: 100%;
  padding: 9px;
  border-radius: 18px;
  border: 1.5px solid #e0c0c0;
  background: #fff;
  color: #8b6b6b;
  font-size: 13px;
  cursor: pointer;
  margin-top: 6px;
}

.setup-step .chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin: 3px 0;
}

.setup-step .chip {
  display: inline-block;
  padding: 5px 10px;
  border-radius: 14px;
  border: 1.5px solid #e0c0c0;
  cursor: pointer;
  font-size: 11px;
  transition: all .2s;
}

.setup-step .chip.selected {
  border-color: #e91e63;
  background: #fce4ec;
  color: #c2185b;
}

.setup-step .api-status {
  padding: 7px 10px;
  border-radius: 6px;
  font-size: 12px;
  margin-top: 6px;
}

.setup-step .api-status.success { background: #e8f5e9; color: #2e7d32; }
.setup-step .api-status.error { background: #ffebee; color: #c62828; }
.setup-step .api-status.testing { background: #fff3e0; color: #e65100; }

/* ==================== Loading ==================== */
.loading-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.85);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

.spinner {
  width: 36px;
  height: 36px;
  border: 3px solid #fce4ec;
  border-top-color: #e91e63;
  border-radius: 50%;
  animation: spin .8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.loading-text {
  margin-top: 10px;
  color: #c2185b;
  font-weight: 600;
  font-size: 13px;
}

/* ==================== Scrollbar ==================== */
.narrative-box::-webkit-scrollbar { width: 4px; }
.narrative-box::-webkit-scrollbar-track { background: transparent; }
.narrative-box::-webkit-scrollbar-thumb { background: #e0c0c0; border-radius: 8px; }

/* ==================== Responsive ==================== */
@media (max-width: 480px) {
  #app { padding: 6px 8px 30px; }
  .header { padding: 10px; border-radius: 12px; }

function shouldTriggerRandomEvent() {
  // 非约会日、非强制任务时段、当天未触发过、15%概率
  var isDatingDay = ([4, 5, 8, 9, 10].indexOf(GS.day) >= 0);
  if (isDatingDay) return null;
  // 强制任务时段排除
  var mandatoryPhases = {
    1: ['evening'], // Day 1 读信
    3: ['morning'], // Day 3 故事
    7: ['morning'], // Day 7 集体外出
    9: ['morning'], // Day 9 X约会
    11: ['evening'] // Day 11 真心话
  };
  var dayMandatory = mandatoryPhases[GS.day] || [];
  if (dayMandatory.indexOf(PHASES[GS.phaseIndex]) >= 0) return null;
  // 检查今天是否已触发
  if (GS.todayRandomEventTriggered) return null;
  if (Math.random() > 0.15) return null;
  // 随机选择一个事件
  var categories = ['weather', 'health', 'accident', 'member'];
  var cat = categories[Math.floor(Math.random() * categories.length)];
  var events = RANDOM_EVENTS[cat];
  var evt = events[Math.floor(Math.random() * events.length)];
  GS.todayRandomEventTriggered = true;
  return evt;
}

function shouldTriggerSecretMission() {
  // 已有任务未完成/未失败时不再触发
  if (GS.secretMission) return false;
  var dayMissions = SECRET_MISSIONS[GS.day];
  if (!dayMissions || dayMissions.length === 0) return false;
  // 只在上午触发
  if (GS.phaseIndex !== 0) return false;
  // 约会日不触发
  var isDatingDay = ([4, 5, 8, 9, 10].indexOf(GS.day) >= 0);
  if (isDatingDay) return false;
  // 随机事件日不触发（互斥）
  if (GS.todayRandomEventTriggered) return false;
  // 强制任务日不触发
  var mandatoryDays = [1, 3, 6, 7, 11, 12];
  if (mandatoryDays.indexOf(GS.day) >= 0) return false;
  // 概率触发：30%
  if (Math.random() > 0.30) return false;
  // 选择任务
  var missionDef = dayMissions[Math.floor(Math.random() * dayMissions.length)];
  var targetId = '';
  if (missionDef.targetType === 'x') targetId = GS.secretX;
  else if (missionDef.targetType === 'nonX') {
    var nonX = GS.selectedMembers.filter(function(id) { return id !== GS.secretX; });
    targetId = nonX[Math.floor(Math.random() * nonX.length)];
  } else if (missionDef.targetType === 'member') {
    targetId = missionDef.targetId;
  } else if (missionDef.targetType === 'any') {
    targetId = GS.selectedMembers[Math.floor(Math.random() * GS.selectedMembers.length)];
  }
  GS.secretMission = {
    id: missionDef.id,
    day: GS.day,
    type: missionDef.type,
    title: missionDef.title,
    description: missionDef.description,
    hint: missionDef.hint,
    targetMemberId: targetId,
    status: 'active',
    triggeredAtPhase: PHASES[GS.phaseIndex]
  };
  return true;
}

      migrateSave();
      return true;
    }
  } catch (e) {

  }
  return false;

    if (json.length > SAVE_SIZE_WARN) {
      console.warn('存档大小: ' + (json.length / 1024).toFixed(1) + 'KB');

    if (e.name === 'QuotaExceededError') {
      alert('⚠️ 存档空间不足！请清理浏览器缓存后重试。');

  var resp = await fetch(API_ENDPOINT, {

    headers: {

    },

      max_tokens: maxTokens,

  if (!resp.ok) {

  var data = await resp.json();
  return data.choices[0].message.content;

// ==================== 叙事解析器（状态机） ====================
function parseNarrative(rawText) {
  var text = rawText.replace(/-xi\b/gi, '');

  // 剥离短信草稿——不出现在正文中
  text = text.replace(/【短信草稿】[\s\S]*?(?=【选项】|$)/g, '');

  text = text
    .replace(/([^\n])(🎬)/g, '$1\n$2')
    .replace(/([^\n])(💭)/g, '$1\n$2')
    .replace(/([^\n])(🎙)/g, '$1\n$2')
    .replace(/([^\n])(🎤)/g, '$1\n$2')
    .replace(/([^\n])(【选项】)/g, '$1\n$2')
    .replace(/【选项】\s*(\d)/g, '【选项】\n\$1');

  var lines = text.split('\n');
  var result = {
    narrative: '',
    directorOS: '',
    observerOS: '',
    interviews: [],
    memberInterviews: [],
    xInterviews: [],
    options: [],
    blocks: []
  };

  var currentNarrativeLines = [];
  var collectMode = null;
  var collectBuffer = [];

  function flushNarrative() {
    if (currentNarrativeLines.length === 0) return;
    var content = currentNarrativeLines.join('\n');
    result.blocks.push({ type: 'narrative', content: content });
    result.narrative += (result.narrative ? '\n' : '') + content;
    currentNarrativeLines = [];
  }

  function pushBlock(type, content) {
    if (!content) return;
    result.blocks.push({ type: type, content: content });
    if (type === 'directorOS') {
      result.directorOS += (result.directorOS ? '\n' : '') + content;
    } else if (type === 'observerOS') {
      result.observerOS += (result.observerOS ? '\n' : '') + content;
    } else if (type === 'interview') {
      result.interviews.push(content);
    } else if (type === 'xInterview') {
      result.xInterviews.push(content);
    } else if (type === 'memberInterview') {
      result.memberInterviews.push(content);
    }
  }

  function flushCollect() {
    if (!collectMode) return;
    var content = collectBuffer.join('\n');
    if (collectMode === 'options') {
      // options were already pushed during collection; nothing to store as block
    } else if (content) {
      pushBlock(collectMode, content);
    }
    collectMode = null;
    collectBuffer = [];
  }

  function tryParseOptionLine(trimmed) {
    var patterns = [
      /^(\d+)[\.、]\s*(.+)/,
      /^(\d+)\)\s*(.+)/,
      /^[①②③④⑤⑥](\d*)\s*(.+)/,
      /^（(\d+)）\s*(.+)/,
      /^[（(](\d+)[)）]\s*(.+)/,
      /^(\d+)\s+(.+)/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var m = trimmed.match(patterns[i]);
      if (m) {
        var t = m[2] || m[3] || '';
        if (t.trim()) return { label: m[1], text: t.trim() };
      }
    }
    return null;
  }

  for (var i = 0; i < lines.length; i++) {
    var trimmed = lines[i].trim();

    if (trimmed.startsWith('🎙️💔') || trimmed.startsWith('🎙💔')) {
      flushCollect();
      flushNarrative();
      var cx = trimmed.replace(/^🎙️?💔\s*/, '').replace(/^【X采访间】\s*/, '');
      if (cx) pushBlock('xInterview', cx);
      else { collectMode = 'xInterview'; collectBuffer = []; }
      continue;
    }

    if (trimmed.startsWith('🎬')) {
      flushCollect();
      flushNarrative();
      var c = trimmed.replace(/^🎬\s*/, '').replace(/^【导演OS】\s*/, '');
      if (c) pushBlock('directorOS', c);
      else { collectMode = 'directorOS'; collectBuffer = []; }
      continue;
    }

    if (trimmed.startsWith('💭')) {
      flushCollect();
      flushNarrative();
      var c2 = trimmed.replace(/^💭\s*/, '').replace(/^【观察员OS】\s*/, '');
      if (c2) pushBlock('observerOS', c2);
      else { collectMode = 'observerOS'; collectBuffer = []; }
      continue;
    }

    if (trimmed.startsWith('🎙')) {
      flushCollect();
      flushNarrative();
      var c3 = trimmed.replace(/^🎙\s*/, '').replace(/^【采访间】\s*/, '');
      if (c3) pushBlock('interview', c3);
      else { collectMode = 'interview'; collectBuffer = []; }
      continue;
    }

    if (trimmed.startsWith('🎤')) {
      flushCollect();
      flushNarrative();
      var c4 = trimmed.replace(/^🎤\s*/, '');
      if (c4) pushBlock('memberInterview', c4);
      else { collectMode = 'memberInterview'; collectBuffer = []; }
      continue;
    }

    if (trimmed === '【选项】' || trimmed.startsWith('【选项】')) {
      flushCollect();
      flushNarrative();
      var afterMarker = trimmed.replace(/^【选项】\s*/, '');
      if (afterMarker) {
        var optParts = afterMarker.split(/(?=\d+[\.、\)])/);
        for (var j = 0; j < optParts.length; j++) {
          var opt = tryParseOptionLine(optParts[j].trim());
          if (opt) result.options.push(opt);
        }
      } else {
        collectMode = 'options';
        collectBuffer = [];
      }
      continue;
    }

    if (trimmed === '') {
      flushCollect();
      flushNarrative();
      continue;
    }

    if (collectMode) {
      if (collectMode === 'options') {
        var optParts2 = trimmed.split(/(?=\d+[\.、\)])/);
        for (var p = 0; p < optParts2.length; p++) {
          var opt2 = tryParseOptionLine(optParts2[p].trim());
          if (opt2) result.options.push(opt2);
        }
      } else {
        collectBuffer.push(trimmed);
      }
      continue;
    }

    currentNarrativeLines.push(trimmed);
  }

  flushCollect();
  flushNarrative();

  // 兜底：扫描 narrative block 中是否混入了观察员名字开头的行，遇到时 inline 插入 observerOS block
  var observerNames = ['李龙真', '金叡园', '郑基锡'];
  if (GS && GS.observerGuest) {
    var gsn = GS.observerGuest.split('（')[0];
    if (gsn && observerNames.indexOf(gsn) < 0) observerNames.push(gsn);
  }

  var newBlocks = [];
  var newNarrativeLines = [];
  for (var b = 0; b < result.blocks.length; b++) {
    var block = result.blocks[b];
    if (block.type !== 'narrative') {
      newBlocks.push(block);
      continue;
    }
    var blockLines = block.content.split('\n');
    var currentLines = [];
    for (var li = 0; li < blockLines.length; li++) {
      var line = blockLines[li].trim();
      var isObs = false;
      for (var s = 0; s < observerNames.length; s++) {
        if (line.indexOf(observerNames[s] + '：') === 0 || line.indexOf(observerNames[s] + ':') === 0) {
          if (currentLines.length > 0) {
            var content = currentLines.join('\n');
            newBlocks.push({ type: 'narrative', content: content });
            newNarrativeLines = newNarrativeLines.concat(currentLines);
            currentLines = [];
          }
          newBlocks.push({ type: 'observerOS', content: line });
          result.observerOS += (result.observerOS ? '\n' : '') + line;
          isObs = true;
          break;
        }
      }
      if (!isObs) currentLines.push(blockLines[li]);
    }
    if (currentLines.length > 0) {
      var content = currentLines.join('\n');
      newBlocks.push({ type: 'narrative', content: content });
      newNarrativeLines = newNarrativeLines.concat(currentLines);
    }
  }
  result.blocks = newBlocks;
  result.narrative = newNarrativeLines.join('\n');

  // 观察员OS硬截断：每个 observerOS block 最多保留4行
  result.observerOS = '';
  for (var nb = 0; nb < result.blocks.length; nb++) {
    var blk = result.blocks[nb];
    if (blk.type === 'observerOS') {
      var obsLines = blk.content.split('\n').filter(function(l) { return l.trim(); });
      if (obsLines.length > 4) obsLines = obsLines.slice(0, 4);
      blk.content = obsLines.join('\n');
      result.observerOS += (result.observerOS ? '\n' : '') + blk.content;
    }
  }

  // 兜底扫描末尾500字
  if (result.options.length === 0) {
    var tail = rawText.slice(-500);
    var tailLines = tail.split('\n');
    for (var t = 0; t < tailLines.length; t++) {
      var opt = tryParseOptionLine(tailLines[t].trim());
      if (opt) result.options.push(opt);
    }
  }

  // 终极兜底：全文本扫描编号行
  if (result.options.length === 0) {
    var allLines = rawText.split('\n');
    for (var u = 0; u < allLines.length; u++) {
      var optU = tryParseOptionLine(allLines[u].trim());
      if (optU) result.options.push(optU);
    }
  }

  // [P0-3] 提取喝酒标记 [喝酒: 成员名]
  var drinkMatches = rawText.match(/\[喝酒:\s*([^\]]+)\]/g);
  if (drinkMatches) {
    for (var dmi = 0; dmi < drinkMatches.length; dmi++) {
      var dm = drinkMatches[dmi].match(/\[喝酒:\s*([^\]]+)\]/);
      if (dm) {
        var drinkerName = dm[1].trim();
        var drinkerMember = MEMBERS.find(function(m) { return m.name === drinkerName; });
        if (drinkerMember && GS.selectedMembers.indexOf(drinkerMember.id) >= 0) {
          if (!GS.drinkCounts[drinkerMember.id]) GS.drinkCounts[drinkerMember.id] = 0;
          GS.drinkCounts[drinkerMember.id]++;
          // 检查醉酒触发（仅第一位达到2杯的人）
          if (!GS.drunkTrigger && GS.drinkCounts[drinkerMember.id] >= 2) {
            GS.drunkTrigger = drinkerMember.id;
          }
        }
      }
    }
  }

  // 从正文及 narrative block 中删除喝酒标记
  result.narrative = result.narrative.replace(/\[喝酒:\s*[^\]]+\]/g, '').trim();
  for (var bj = 0; bj < result.blocks.length; bj++) {
    if (result.blocks[bj].type === 'narrative') {
      result.blocks[bj].content = result.blocks[bj].content.replace(/\[喝酒:\s*[^\]]+\]/g, '').trim();
    }
  }

  // 提取好感度隐藏标记（兼容普通方括号 [好感度: ... ]）
  var affMatches = rawText.match(/\[好感度:\s*([^\]]+)\]/g);
  if (affMatches) {
    for (var v = 0; v < affMatches.length; v++) {
      var affM = affMatches[v].match(/\[好感度:\s*([^,]+)\s*([+-]\d+),\s*原因:\s*([^\]]+)\]/);
      if (!affM) affM = affMatches[v].match(/\[好感度:\s*([^\]\d]+?)\s*([+-]\d+)[^\]]*\]/);
      if (affM) {
        var affName = affM[1].trim();
        var affDelta = parseInt(affM[2]);
        var affReason = affM[3] ? affM[3].trim() : '（AI未提供原因）';
        var affMember = MEMBERS.find(function(m) { return m.name === affName; });
        if (affMember && GS.selectedMembers.indexOf(affMember.id) >= 0) {
          updateAffection(affMember.id, affDelta);
          if (!GS.affectionLog[affMember.id]) GS.affectionLog[affMember.id] = [];
          GS.affectionLog[affMember.id].push({
            day: GS.day,
            phase: PHASE_LABELS[PHASES[GS.phaseIndex]],
            change: affDelta,
            reason: affReason,
            total: GS.affection[affMember.id]
          });
        }
      }
    }
  }

  // 从正文及 narrative block 中删除好感度标记
  result.narrative = result.narrative.replace(/\[好感度:\s*[^\]]+\]/g, '').trim();
  for (var bi = 0; bi < result.blocks.length; bi++) {
    if (result.blocks[bi].type === 'narrative') {
      result.blocks[bi].content = result.blocks[bi].content.replace(/\[好感度:\s*[^\]]+\]/g, '').trim();
    }
  }

  // 解析秘密任务完成标记 [秘密任务完成]
  var missionCompleteMatch = rawText.match(/\[秘密任务完成\]/);
  if (missionCompleteMatch && GS.secretMission && GS.secretMission.status === 'active') {
    GS.secretMission.status = 'completed';
    GS.secretMission.completedAt = { day: GS.day, phase: PHASES[GS.phaseIndex] };
    GS.secretMissionHistory.push(JSON.parse(JSON.stringify(GS.secretMission)));
    GS.secretMissionCompletedCount++;
    // 发放奖励
    var targetId = GS.secretMission.targetMemberId;
    if (targetId) {
      updateAffection(targetId, 3);
      addAffectionLog(targetId, 3, '完成秘密任务「' + GS.secretMission.title + '」');
      // 解锁心动笔记
      if (!GS.heartNotes[targetId]) GS.heartNotes[targetId] = [];
      var notes = HEART_NOTE_TEMPLATES[targetId];
      if (notes && GS.heartNotes[targetId].length < notes.length) {
        var nextNote = notes[GS.heartNotes[targetId].length];
        GS.heartNotes[targetId].push({
          text: nextNote,
          unlockedAt: { day: GS.day, mission: GS.secretMission.title }
        });
      }
      var targetMember = MEMBERS.find(function(m) { return m.id === targetId; });
      if (targetMember) {
        showToast('✅ 秘密任务完成！' + targetMember.name + ' 好感度 +3 · 心动笔记已解锁');

    } else {

    }
    // 检查是否解锁最终奖励（完成3个任务）
    if (GS.secretMissionCompletedCount >= 3 && !GS.secretMissionUnlockFinal) {
      GS.secretMissionUnlockFinal = true;
    }
    GS.secretMission = null;
    saveGame();
  }
  // 从正文中删除秘密任务标记
  result.narrative = result.narrative.replace(/\[秘密任务完成\]/g, '').trim();
  for (var bj = 0; bj < result.blocks.length; bj++) {
    if (result.blocks[bj].type === 'narrative') {
      result.blocks[bj].content = result.blocks[bj].content.replace(/\[秘密任务完成\]/g, '').trim();
    }
  }

  return result;
}

function getTodayFullText() {
  return GS.todayFullText.join('\n\n---\n\n');
}

function getTodayFullTextCapped() {
  var full = getTodayFullText();
  if (full.length <= TODAY_TEXT_CAP) return full;
  return '[当日上下文过长，已压缩为摘要]\n' + (GS._todayCompressedSummary || full.slice(0, 4000));
}

function getTodayNarrativeTail(charCount) {
  var full = getTodayFullText();
  var cleanLines = [];
  var lines = full.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (t.startsWith('🎬') || t.startsWith('💭') || t.startsWith('🎙') || t.startsWith('🎤') || t.startsWith('🎙️💔')) continue;
    if (t === '---' || t === '') continue;
    if (t === '【选项】' || t.startsWith('【选项】')) continue;
    if (t.startsWith('【短信草稿】')) continue;
    if (t.match(/^\d+[\.、\)]\s/)) continue;
    cleanLines.push(lines[i]);
  }
  var cleanText = cleanLines.join('\n');
  if (cleanText.length <= charCount) return cleanText;

  var tail = cleanText.slice(-charCount);
  var openQuote = false;
  for (var i = 0; i < tail.length; i++) {
    if (tail[i] === '"' || tail[i] === '\u201c' || tail[i] === '\u201d' || tail[i] === '\u300c' || tail[i] === '\u300d') {
      openQuote = !openQuote;
    }
  }
  if (openQuote) {
    var before = cleanText.slice(0, cleanText.length - charCount);
    for (var i = before.length - 1; i >= 0; i--) {
      if (before[i] === '"' || before[i] === '\u201c' || before[i] === '\u201d' || before[i] === '\u300c' || before[i] === '\u300d') {
        var extended = before.slice(i) + tail;
        if (extended.length <= charCount + 300) {
          return '...（前略）...\n\n' + extended;
        }
        break;
      }
    }
  }

  return '...（前略）...\n\n' + tail;
}

function getTodayKeyEventsSummary() {
  var full = getTodayFullText();
  if (!full || full.length < 500) return '';
  var interviews = [];
  var lines = full.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (t.startsWith('🎙') || t.startsWith('🎤') || t.startsWith('🎙️💔')) interviews.push(t);
  }
  if (interviews.length === 0) return '';
  return '今日关键事件（采访间摘要·仅供了解·禁止复述）：\n' + interviews.join('\n');
}

    }

    // Day 3：故事环节人物驱动指导

        '- 每个故事后可以有其他人的追问和反应。观察员会分析每个故事中隐藏的信息。\n';

        '5. ⚠️⚠️⚠️ 醉酒触发核心规则：谁最先喝到≥2杯，谁就是醉酒剧情触发者！仅触发1位！\n' +
        '   - 后续任何人再喝到2杯也不再判定醉酒剧情\n' +

      msg += '⚠️⚠️⚠️ 今天是X约会日！强制与X约会。只生成1个选项：「▶ 进入约会场景」。\n';
    }

    if (GS.phaseIndex === 3 && !GS.smsSentToday) {
      msg += '\n深夜时段：请在输出末尾额外生成3条短信草稿（每条≤25字），格式：\n【短信草稿】\n1. 短信内容一（1-2句话，不超过25字）\n2. 短信内容二\n3. 短信内容三\n⚠️ 短信草稿只在【短信草稿】标记中生成，不在正文段落中出现。短信草稿内容不含成员姓名。短信风格：简短、含蓄、符合节目调性。不直白表白，用暗示和温暖的话语。';

  }

  msg += getFormatReminder(isDatingDay, isSms);
  return msg;

async function generateAllXArchives() {
  var xMember = MEMBERS.find(function(m) { return m.id === GS.secretX; });
  var otherIds = GS.selectedMembers.filter(function(id) { return id !== GS.secretX; });

  showLoading('正在生成X关系故事...');
  try {
    var storyRaw = await callDeepSeek(
      buildXArchiveMainPrompt(),
      '请生成女主与' + xMember.name + '的完整恋爱档案。',
      TOKEN_CONFIG.xMainStory
    );
    var hiddenMatch = storyRaw.match(/【隐藏信息】([\s\S]*)$/i);
    if (hiddenMatch) {
      GS.xBackstoryHidden = hiddenMatch[1].trim();
      GS.xBackstory = storyRaw.replace(/【隐藏信息】[\s\S]*$/i, '').trim();
    } else {
      GS.xBackstory = storyRaw.trim();
      GS.xBackstoryHidden = '';
    }
    saveGame();
  } catch (e) {
    GS.xBackstory = 'X档案生成失败，请刷新重试。';
    saveGame();
  }
  hideLoading();

  if (GS.aiEnabled && GS.xBackstory && GS.xBackstory.length > 50 && GS.xBackstory.indexOf('失败') < 0) {
    showLoading('正在生成X记忆物品索引...');
    try {
      var itemsRaw = await callDeepSeek(
        buildXArchiveItemsPrompt(GS.xBackstory),
        '请基于上述故事提取记忆物品（简洁索引）。',
        TOKEN_CONFIG.xItems
      );
      GS.xItems[GS.secretX] = itemsRaw.trim();
      saveGame();
    } catch (e) {
      console.error('X items failed:', e);
    }
    hideLoading();
  }

  for (var i = 0; i < otherIds.length; i++) {
    var id = otherIds[i];
    var m = MEMBERS.find(function(x) { return x.id === id; });
    showLoading('正在生成' + m.name + '的X档案（' + (i + 1) + '/' + otherIds.length + '）...');
    try {
      var memberRaw = await callDeepSeek(
        buildXArchiveMemberPrompt(id),
        '请生成' + m.name + '与场外X的分手原因。',
        TOKEN_CONFIG.xMemberReason
      );
      GS.memberXBackstories[id] = memberRaw.trim();
      saveGame();

      // 生成场外X记忆物品
      if (GS.aiEnabled && memberRaw && memberRaw.length > 30) {
        try {
          var itemsRaw2 = await callDeepSeek(
            buildXArchiveItemsMemberPrompt(memberRaw, m.name),
            '请提取记忆物品。',
            TOKEN_CONFIG.xItems
          );
          GS.xItems[id] = itemsRaw2.trim();
          saveGame();
        } catch (e) {
          console.error('Member X items failed:', e);
        }
      }
    } catch (e) {
      GS.memberXBackstories[id] = '场外X档案生成失败，请刷新重试。';
      saveGame();
    }
    hideLoading();
  }
}

// ==================== 好感度系统 ====================
function updateAffection(memberId, delta) {
  if (!GS.affection[memberId]) GS.affection[memberId] = 0;
  var before = GS.affection[memberId];
  var after = Math.max(-100, Math.min(100, before + delta));
  GS.affection[memberId] = after;

  // [P1-4] 好感度里程碑 Toast（每位成员只触发一次）
  if (!GS.affMilestoneShown) GS.affMilestoneShown = {};
  if (!GS.affMilestoneShown[memberId]) GS.affMilestoneShown[memberId] = {};
  var m = MEMBERS.find(function(x) { return x.id === memberId; });
  var thresholds = [40, 60, 80];
  var msgs = { 40: '💚 他开始在意你了', 60: '❤️ 他明显对你有好感', 80: '❤️🔥 他深深被你吸引' };
  for (var t = 0; t < thresholds.length; t++) {
    var th = thresholds[t];
    if (before < th && after >= th && !GS.affMilestoneShown[memberId][th]) {
      GS.affMilestoneShown[memberId][th] = true;
      if (m) showToast(m.name + ' ' + msgs[th]);
    }
  }
}

function getAffectionDesc(aff) {
  if (aff >= 80) return '❤️🔥';
  if (aff >= 60) return '❤️';
  if (aff >= 40) return '💚';
  if (aff >= 15) return '😐';
  if (aff >= 0) return '💙';
  return '💔';
}

function getAffectionHint(memberId) {
  var aff = GS.affection[memberId] || 0;
  var m = MEMBERS.find(function(x) { return x.id === memberId; });
  return m.emoji + m.name + ' ' + getAffectionDesc(aff);
}

function addAffectionLog(memberId, delta, reason) {
  if (!GS.affectionLog[memberId]) GS.affectionLog[memberId] = [];
  GS.affectionLog[memberId].push({
    day: GS.day,
    phase: PHASE_LABELS[PHASES[GS.phaseIndex]],
    change: delta,
    reason: reason,
    total: GS.affection[memberId]
  });
}

// ==================== 提取待兑现约定 ====================
function extractPendingPromises(summaryText) {
  var promises = [];
  var lines = summaryText.split('\n');
  var inPromises = false;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (t.indexOf('待兑现约定') >= 0 || t.indexOf('约定') >= 0) {
      inPromises = true;
      continue;
    }
    if (inPromises) {
      if (t.startsWith('-') || t.startsWith('•') || t.match(/^\d+[\.、]/)) {
        promises.push(t.replace(/^[-•\d\.、\s]+/, '').trim());
      } else if (t === '' || t.indexOf('今日已揭示') >= 0 || t.indexOf('关键事件') >= 0) {
        inPromises = false;
      }
    }
  }
  return promises;
}

function extractRevealedInfo(summaryText) {
  var info = [];
  var lines = summaryText.split('\n');
  var inInfo = false;
  for (var i = 0; i < lines.length; i++) {
    var t = lines[i].trim();
    if (t.indexOf('今日已揭示信息') >= 0 || t.indexOf('已揭示') >= 0) {
      inInfo = true;
      continue;
    }
    if (inInfo) {
      if (t.startsWith('-') || t.startsWith('•') || t.match(/^\d+[\.、]/)) {
        info.push(t.replace(/^[-•\d\.、\s]+/, '').trim());
      } else if (t === '') {
        inInfo = false;
      }
    }
  }
  return info.join('\n');
}

function bindSetupEvents() {
  if (GS.step === 1) {
    document.getElementById('apiKeyInput').addEventListener('input', function() {
      GS.apiKey = this.value.trim();
      saveGame();
    });
    document.getElementById('aiEnabledCheck').addEventListener('change', function() {
      GS.aiEnabled = this.checked;
      saveGame();
    });
    document.getElementById('testApiBtn').addEventListener('click', async function() {
      var s = document.getElementById('apiStatus');
      s.classList.remove('hidden', 'success', 'error', 'testing');
      s.classList.add('testing');
      s.textContent = '⏳ 正在测试连接...';
      var ok = await testAPIConnection(GS.apiKey);
      s.classList.remove('testing');
      if (ok) {
        s.classList.add('success');
        s.textContent = '✅ 连接成功！API Key 有效';
      } else {
        s.classList.add('error');
        s.textContent = '❌ 连接失败，请检查 API Key';
      }
    });
    document.getElementById('step1Next').addEventListener('click', function() {
      if (!GS.apiKey.trim()) {
        alert('请输入 API Key');
        return;
      }
      GS.step = 2;
      saveGame();
      renderAll();
    });
  }

  if (GS.step === 2) {
    if (!GS.profileLocked) {
      document.getElementById('hpName').addEventListener('input', function() {
        GS.heroineProfile.name = this.value;
        saveGame();
      });
      document.getElementById('hpAge').addEventListener('input', function() {
        GS.heroineProfile.age = parseInt(this.value) || 25;
        saveGame();
      });
      document.getElementById('hpJob').addEventListener('input', function() {
        GS.heroineProfile.job = this.value;
        saveGame();
      });
      bindChipGroup('zodiacChips', function(val) {
        GS.heroineProfile.zodiac = (GS.heroineProfile.zodiac === val) ? '' : val;
        saveGame();
      }, true);
      bindChipGroup('appearanceChips', function(val) {
        toggleArrayItem(GS.heroineProfile.appearance, val);
        saveGame();
      }, false);
      bindChipGroup('personalityChips', function(val) {
        toggleArrayItem(GS.heroineProfile.personality, val);
        saveGame();
      }, false);
      bindChipGroup('mbtiChips', function(val) {
        GS.heroineProfile.mbti = val;
        saveGame();
      }, true);
      bindChipGroup('privateChips', function(val) {
        toggleArrayItem(GS.heroineProfile.privateTraits, val);
        saveGame();
      }, false);
    }
    document.getElementById('step2Next').addEventListener('click', function() {
      if (!GS.profileLocked) {
        GS.profileLocked = true;
        GS.secretX = '';
      }
      GS.step = 3;
      saveGame();
      renderAll();
    });
    if (!GS.profileLocked) {
      document.getElementById('step2Back').addEventListener('click', function() {
        GS.step = 1;
        saveGame();
        renderAll();
      });
    }
  }

  if (GS.step === 3) {
    document.querySelectorAll('#memberGrid .member-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        var id = this.dataset.id;
        if (GS.selectedMembers.indexOf(id) >= 0) {
          GS.selectedMembers = GS.selectedMembers.filter(function(x) { return x !== id; });
        } else if (GS.selectedMembers.length < 3) {
          GS.selectedMembers.push(id);
        }
        saveGame();
        renderAll();
      });
    });
    document.getElementById('step3Next').addEventListener('click', function() {
      if (GS.selectedMembers.length !== 3) return;
      GS.step = 4;
      GS.secretX = '';
      saveGame();
      renderAll();
    });
    document.getElementById('step3Back').addEventListener('click', function() {
      GS.step = 2;
      saveGame();
      renderAll();
    });
  }

  if (GS.step === 4) {
    document.querySelectorAll('#xGrid .member-chip').forEach(function(chip) {
      chip.addEventListener('click', function() {
        GS.secretX = this.dataset.id;
        saveGame();
        renderAll();
      });
    });
    document.getElementById('step4Start').addEventListener('click', async function() {
      if (!GS.secretX) return;
      var otherMembers = GS.selectedMembers.filter(function(id) { return id !== GS.secretX; });
      GS.affection = {};
      GS.affection[GS.secretX] = randInt(35, 50);
      for (var i = 0; i < otherMembers.length; i++) {
        GS.affection[otherMembers[i]] = randInt(0, 5);
      }
      GS.step = 5;
      GS.day = 1;
      GS.phaseIndex = 0;
      GS.stayCount = 0;
      GS.phaseChoiceCount = 0;
      GS.todayFullText = [];
      GS.dailyFullTexts = [];
      GS.dailySummaries = [];
      GS.observerGuest = '';
      GS.observerGuestPrevious = '';
      GS.pendingDatingResult = null;
      GS.currentDatingPartner = null;
      GS.datingDiceResult = null;
      GS.day10ChosenDate = null;
      GS.pendingPromises = [];
      GS.todayRevealedInfo = '';
      GS.affectionLog = {};
      GS.prevRawText = '';
      GS.pendingMemoryReview = null;
      GS.drunkTrigger = null;
      saveGame();
      renderAll();
      if (GS.aiEnabled) {
        await generateAllXArchives();
      } else {
        GS.xBackstory = 'AI未启用，X档案将在AI启用后生成。';
        saveGame();
      }
      await generatePhaseNarrative();
    });
    document.getElementById('step4Back').addEventListener('click', function() {
      GS.step = 3;
      saveGame();
      renderAll();
    });
  }
}

function bindChipGroup(containerId, callback, isSingle) {
  var c = document.getElementById(containerId);
  if (!c) return;
  c.querySelectorAll('.chip').forEach(function(chip) {
    chip.addEventListener('click', function() {
      var val = this.dataset.val;
      if (isSingle) {
        c.querySelectorAll('.chip').forEach(function(x) { x.classList.remove('selected'); });
        this.classList.add('selected');
      } else {
        this.classList.toggle('selected');
      }
      callback(val);
    });
  });
}

function toggleArrayItem(arr, val) {
  var idx = arr.indexOf(val);
  if (idx >= 0) arr.splice(idx, 1);
  else arr.push(val);
}

    }
  }

  // [P0-3] 真心话模式下 Action Bar 只显示重新生成
  if (GS.truthState && GS.truthState.active) {
    html += '<div class="card"><div class="action-bar" id="actionBar">';
    html += '<button class="btn-regenerate" id="btnRegenerate">🔄 重新生成本段</button>';
    html += '</div></div>';
  } else {
    // 普通 Action Bar
    html += '<div class="card"><div class="action-bar" id="actionBar">';
    if (!hasConsequences) {
      html += '<button class="btn-regenerate" id="btnRegenerate">🔄 重新生成本段</button>';
      if (!phaseChoicesExhausted || isDay11) {
        html += '<button class="btn-skip" id="btnSkip">▶ 跳过进入下一时段</button>';
      } else {
        html += '<button class="btn-skip" id="btnSkip" style="font-weight:900">▶ 进入下一时段</button>';
      }
      if (isNight && !smsSent) html += '<button class="btn-sms" id="btnSms">📨 发送心动短信</button>';
    } else {
      if (!isNight) {
        if (!phaseChoicesExhausted || isDay11) {
          html += '<button class="btn-skip" id="btnNextPhase">▶ 进入下一时段</button>';
        } else {
          html += '<button class="btn-skip" id="btnNextPhase" style="font-weight:900">▶ 进入下一时段</button>';
        }
        html += '<button class="btn-regenerate" id="btnRegenerate">🔄 重新生成本段</button>';
      } else {
        if (!smsSent) html += '<button class="btn-sms" id="btnSms">📨 发送心动短信</button>';
        html += '<button class="btn-regenerate" id="btnRegenerate">🔄 重新生成本段</button>';
      }
    }
    if (smsSent && isNight) {
      html += '<button class="btn-next-day" id="btnNextDay">✅ 确认进入下一天</button>';
      if (!stayExhausted) {
        html += '<button class="btn-continue" id="btnContinue">✍️ 继续今天（' + GS.stayCount + '/' + MAX_STAY_COUNT + '）</button>';
      }
    }
    html += '</div></div>';
  }

  // 自由输入
  var freeDisabled = (smsSent && isNight && stayExhausted);
  html += '<div class="card"><div class="free-input-area">' +
    '<input type="text" id="freeInput" placeholder="✍️ 自由输入你的行动/想法..." value="' +
    escHtml(GS.freeInput || '') + '"' + (freeDisabled ? ' disabled' : '') + '>' +
    '<button class="btn-save-input" id="btnSaveInput">💾</button>' +
    '<button class="btn-act-input" id="btnActInput"' + (freeDisabled ? ' disabled' : '') + '>✍️ 行动</button></div></div>';

  // 游戏结束
  if (GS.gameOver) {
    html += renderEndingScreen(members);
  }

  return html;
}

function renderParsedNarrative(parsed) {
  var html = '';

  // 新版：按 AI 返回的顺序依次渲染每个 block，采访间/成员采访间/X采访间会出现在正文对应位置
  if (parsed.blocks && parsed.blocks.length > 0) {
    for (var i = 0; i < parsed.blocks.length; i++) {
      var b = parsed.blocks[i];
      var content = (b.content || '').trim();
      if (!content) continue;

      if (b.type === 'narrative') {
        var paras = content.split('\n').filter(function(p) { return p.trim(); });
        for (var p = 0; p < paras.length; p++) {
          html += '<p>' + escHtml(paras[p]) + '</p>';
        }
      } else if (b.type === 'interview') {
        html += '<div class="interview">🎙 <strong>【采访间】</strong> ' + escHtml(content) + '</div>';
      } else if (b.type === 'xInterview') {
        html += '<div class="x-interview">🎙️💔 <strong>【X采访间】</strong> ' + escHtml(content) + '</div>';
      } else if (b.type === 'memberInterview') {
        html += '<div class="member-interview">🎤 ' + escHtml(content) + '</div>';
      } else if (b.type === 'directorOS') {
        var dlines = content.split('\n').filter(function(l) { return l.trim(); });
        for (var m = 0; m < dlines.length; m++) {
          html += '<div class="director-os">🎬 <strong>【导演OS】</strong> ' + escHtml(dlines[m]) + '</div>';
        }
      } else if (b.type === 'observerOS') {
        var olines = content.split('\n').filter(function(l) { return l.trim(); });
        for (var n = 0; n < olines.length; n++) {
          var formatted = olines[n].replace(
            /^(李龙真|金叡园|郑基锡|[\u4e00-\u9fa5]+)[：:]/,
            '<span class="obs-name">$1：</span>'
          );
          html += '<div class="observer-os">💭 ' + formatted + '</div>';
        }
      }
    }
    return html;
  }

  // 兼容旧存档：没有 blocks 时按字段聚合渲染（全部堆在底部）
  if (parsed.narrative) {
    var paras = parsed.narrative.split('\n').filter(function(p) { return p.trim(); });
    for (var ii = 0; ii < paras.length; ii++) {
      html += '<p>' + escHtml(paras[ii]) + '</p>';
    }
  }
  if (parsed.interviews && parsed.interviews.length > 0) {
    for (var j = 0; j < parsed.interviews.length; j++) {
      html += '<div class="interview">🎙 <strong>【采访间】</strong> ' + escHtml(parsed.interviews[j]) + '</div>';
    }
  }
  if (parsed.xInterviews && parsed.xInterviews.length > 0) {
    for (var k = 0; k < parsed.xInterviews.length; k++) {
      html += '<div class="x-interview">🎙️💔 <strong>【X采访间】</strong> ' + escHtml(parsed.xInterviews[k]) + '</div>';
    }
  }
  if (parsed.memberInterviews && parsed.memberInterviews.length > 0) {
    for (var l = 0; l < parsed.memberInterviews.length; l++) {
      html += '<div class="member-interview">🎤 ' + escHtml(parsed.memberInterviews[l]) + '</div>';
    }
  }
  if (parsed.directorOS) {
    var dlines2 = parsed.directorOS.split('\n').filter(function(l) { return l.trim(); });
    for (var mm = 0; mm < dlines2.length; mm++) {
      html += '<div class="director-os">🎬 <strong>【导演OS】</strong> ' + escHtml(dlines2[mm]) + '</div>';
    }
  }
  if (parsed.observerOS) {
    var olines2 = parsed.observerOS.split('\n').filter(function(l) { return l.trim(); });
    for (var nn = 0; nn < olines2.length; nn++) {
      var formatted2 = olines2[nn].replace(
        /^(李龙真|金叡园|郑基锡|[\u4e00-\u9fa5]+)[：:]/,
        '<span class="obs-name">$1：</span>'
      );
      html += '<div class="observer-os">💭 ' + formatted2 + '</div>';
    }
  }
  return html;
}

// ==================== 游戏流程 ====================
async function generatePhaseNarrative() {
  // 秘密任务触发（在生成剧情前检查）
  if (shouldTriggerSecretMission()) {
    saveGame();
  }

  // Day 4/5/8 约会配对：弹出骰子弹窗
  if ([4, 5, 8].indexOf(GS.day) >= 0 && GS.phaseIndex === 0 && !GS.datingDiceResult) {
    showDatingDiceModal();
    return;
  }

  // [P0-3] Day 11 傍晚：初始化真心话模式（3轮制：轻度→中度→深度，每轮4人）
  if (GS.day === 11 && GS.phaseIndex === 2 && !GS.truthState) {
    // 按难度分组并打乱
    var lightCards = TRUTH_CARDS.filter(function(c) { return c.level === 'light'; });
    var mediumCards = TRUTH_CARDS.filter(function(c) { return c.level === 'medium'; });
    var deepCards = TRUTH_CARDS.filter(function(c) { return c.level === 'deep'; });
    function shuffle(arr) {
      for (var i = arr.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
      }
      return arr;
    }
    // 抽卡人顺序：女主 + 3位成员
    var drawerOrder = ['heroine'].concat(GS.selectedMembers);
    GS.truthState = {
      active: true,
      round: 1,              // 1=轻度轮, 2=中度轮, 3=深度轮
      subRound: 1,           // 1-4（当前轮中的第几个人）
      levelMap: {
        light: shuffle(lightCards),
        medium: shuffle(mediumCards),
        deep: shuffle(deepCards)
      },
      usedCards: [],
      drawerOrder: drawerOrder,
      drunkDeclared: false
    };
    saveGame();
  }

  // [P0-3] Day 11 深夜：真心话12轮结束后或醉酒触发后进入深夜
  if (GS.day === 11 && GS.phaseIndex === 3) {
    // 若真心话已结束且存在醉酒触发者，生成醉酒剧情
    if (GS.truthState && !GS.truthState.active && GS.drunkTrigger) {
      await generateDrunkNarrative();
      return;
    }
    // 若真心话已结束且无醉酒，正常深夜（发短信）
    if (GS.truthState && !GS.truthState.active && !GS.drunkTrigger) {
      // 正常深夜流程，继续执行后面的代码
    }
  }

  if (!GS.aiEnabled) {
    GS.phaseNarrative = '';
    GS.parsedNarrative = {
      narrative: '', directorOS: '', observerOS: '',
      interviews: [], memberInterviews: [], xInterviews: [], options: []
    };
    GS.currentOptions = [];
    GS.consequenceNarratives = [];
    GS.isInConsequence = false;
    GS.prevSummary = '';
    GS.prevRawText = '';
    GS.pendingDatingResult = null;
    saveGame();
    renderAll();
    return;
  }

  showLoading('正在生成时段剧情...');
  try {
    await compressTodayForInjection();
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('phase');
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.phaseNarrative);
    GS.phaseNarrative = rawText;
    GS.parsedNarrative = parseNarrative(rawText);
    GS.currentOptions = GS.parsedNarrative.options;
    GS.consequenceNarratives = [];
    GS.isInConsequence = false;
    GS.phaseChoiceCount = 0;

    // 约会日只保留1个选项，并追加「进入约会场景」
    var isDatingDay = ([4, 5, 8, 9].indexOf(GS.day) >= 0 && GS.phaseIndex === 0);
    if (isDatingDay && GS.currentOptions.length > 1) {
      GS.currentOptions = GS.currentOptions.slice(0, 1);
    }
    if (isDatingDay && GS.currentOptions.length >= 1) {
      GS.currentOptions.push({ label: '▶', text: '▶ 进入约会场景' });
    }

    if (GS.phaseIndex === 3 && !GS.smsSentToday) {
      GS.smsDrafts = extractSmsDrafts(rawText);
    } else {
      GS.smsDrafts = [];
    }

    GS.todayFullText.push(rawText);
    GS.mainInterview = (GS.parsedNarrative.interviews || []).join(' ').slice(0, 100);
    GS.prevSummary = rawText.slice(0, 200);
    GS.prevRawText = rawText;

    if (GS.datingDiceResult) {
      GS.currentDatingPartner = GS.datingDiceResult.partner;
      GS.pendingDatingResult = GS.datingDiceResult.partner;
      GS.datingDiceResult = null;
    } else {
      GS.pendingDatingResult = null;
    }

    saveGame();
    renderAll();
    // [P2-7] Day 4/6 自动弹出 X 记忆物品展示
    if ((GS.day === 4 || GS.day === 6) && GS.phaseIndex === 0) {
      setTimeout(showXItemsModal, 500);
    }
  } catch (e) {
    alert('⚠️ AI 生成失败：' + e.message + '\n请点击刷新按钮重试。');
    GS.phaseNarrative = '';
    GS.parsedNarrative = {
      narrative: '', directorOS: '', observerOS: '',
      interviews: [], memberInterviews: [], xInterviews: [], options: []
    };
    GS.currentOptions = [];
    GS.consequenceNarratives = [];
    GS.isInConsequence = false;
    GS.pendingDatingResult = null;
    saveGame();
    renderAll();
  }
  hideLoading();
}

function extractSmsDrafts(rawText) {
  var drafts = [];
  var match = rawText.match(/【短信草稿】([\s\S]*?)(?:【选项】|$)/);
  if (match) {
    var lines = match[1].split('\n');
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^\d+[\.、]\s*(.+)/);
      if (m && m[1].trim().length <= 25) drafts.push(m[1].trim());
    }
  }
  if (drafts.length === 0) {
    drafts.push('今天和你聊天很开心。', '谢谢你今天的陪伴。', '晚安，明天见。');
  }
  while (drafts.length < 3) drafts.push('今天过得很愉快。');
  return drafts.slice(0, 3);
}

// [P0-3] Day 11 深夜醉酒剧情生成
async function generateDrunkNarrative() {
  showLoading('正在生成醉酒剧情...');
  try {
    var members = GS.selectedMembers.map(function(id) {
      return MEMBERS.find(function(m) { return m.id === id; });
    });
    var triggerId = GS.drunkTrigger;
    var triggerName = '女主';
    var isHeroine = triggerId === 'heroine';
    var isX = triggerId === GS.secretX;
    var triggerMember = members.find(function(m) { return m.id === triggerId; });
    if (triggerMember) triggerName = triggerMember.name;

    // [P0-3] X 醉酒且好感<50：X自己回房间，不触发互动
    if (isX && (GS.affection[triggerId] || 0) < 50) {
      GS.phaseNarrative = '🎬【导演OS】' + triggerName + '喝得太多，独自起身回了房间。门轻轻关上，留下客厅里的其他人面面相觑。\n\n' +
        '这一夜，没有更多的故事发生。\n\n' +
        '💭【观察员OS】\n李龙真：看来X是真的放下了。\n金叡园：有点遗憾……但也松了一口气。\n郑基锡：酒精是情感的放大镜，有时是，有时不是。';
      GS.parsedNarrative = parseNarrative(GS.phaseNarrative);
      GS.currentOptions = [{ label: '▶', text: '▶ X已回房间，继续深夜' }];
      GS.consequenceNarratives = [];
      GS.isInConsequence = false;
      GS.phaseChoiceCount = 0;
      GS.todayFullText.push(GS.phaseNarrative);
      GS.smsDrafts = [];
      saveGame();
      renderAll();
      hideLoading();
      return;
    }

    // [FIX-9.3] X醉酒嫉妒剧情：好感≥80且另一成员≥50时触发
    if (isX && (GS.affection[triggerId] || 0) >= 80) {
      var jealousTarget = members.find(function(m) {
        return m.id !== triggerId && (GS.affection[m.id] || 0) >= 50;
      });
      if (jealousTarget) {

// [P0-3] Day 11 真心话单轮处理（3轮制：轻度→中度→深度，每轮4人）
async function handleTruthRound(opt) {
  var ts = GS.truthState;
  var levelNames = { light: '轻度', medium: '中度', deep: '深度' };
  var currentLevel = ts.round === 1 ? 'light' : ts.round === 2 ? 'medium' : 'deep';
  var drawerId = ts.drawerOrder[ts.subRound - 1];
  var isHeroineTurn = (drawerId === 'heroine');

  // 从当前难度卡池抽取问题卡
  var card = null;
  if (ts.levelMap[currentLevel] && ts.levelMap[currentLevel].length > 0) {
    card = ts.levelMap[currentLevel].shift();
    ts.usedCards.push(card);
  }

  var playerAnswer = '';

  if (isHeroineTurn && opt.text.indexOf('回答') >= 0) {
    // 女主选择如实回答：弹出输入框
    playerAnswer = await showTruthAnswerModal();
    if (!playerAnswer) return; // 用户取消
  }

  if (opt.text.indexOf('喝酒') >= 0) {
    // 记录喝酒
    if (!GS.drinkCounts[drawerId]) GS.drinkCounts[drawerId] = 0;
    GS.drinkCounts[drawerId]++;
    if (!GS.drunkTrigger && GS.drinkCounts[drawerId] >= 2) {
      GS.drunkTrigger = drawerId;
      ts.drunkDeclared = true;
    }
  }

  // 推进轮次
  ts.subRound++;
  if (ts.subRound > 4) {
    // 当前轮（难度）的4人已结束，进入下一轮（下一个难度）
    ts.round++;
    ts.subRound = 1;
  }

  // 检查是否结束真心话（3轮 × 4人 = 12人次完成）
  if (ts.round > 3) {
    ts.active = false;
  }

  saveGame();

  // 生成真心话剧情（复用 consequence 机制）
  showLoading('正在生成真心话剧情...');
  try {
    await compressTodayForInjection();
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('consequence', {
      choiceText: opt.text,
      truthRound: ts.round,
      truthSubRound: ts.subRound,
      truthLevel: currentLevel,
      truthCard: card,
      truthDrawer: drawerId,
      truthAnswer: playerAnswer
    });
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.consequence);
    var parsed = parseNarrative(rawText);
    GS.consequenceNarratives.push({ rawText: rawText, parsed: parsed });
    GS.todayFullText.push(rawText);
    saveGame();
    renderAll();

    // 真心话结束后显示"进入深夜"按钮
    if (!ts.active) {
      GS.currentOptions = [{ label: '▶', text: '▶ 真心话结束，进入深夜' }];
      saveGame();
      renderAll();
    }
  } catch (e) {
    alert('⚠️ AI 生成失败：' + e.message + '\n请点击刷新按钮重试。');
  }
  hideLoading();
}

async function handleOptionChoice(opt) {
  // [P0-3] 真心话结束后进入深夜
  if (opt.text.indexOf('进入深夜') >= 0 || opt.text.indexOf('真心话结束') >= 0 || opt.text.indexOf('X已回房间') >= 0) {
    await advancePhase();
    return;
  }

  if (GS.day === 12 && (opt.text.indexOf('选择') >= 0 || opt.text.indexOf('复合') >= 0 || opt.text.indexOf('换乘') >= 0)) {
    await handleFinalChoice(opt);
    return;
  }

  // [P0-3] Day 11 真心话模式：完全独立处理
  if (GS.truthState && GS.truthState.active) {
    await handleTruthRound(opt);
    return;
  }

  // [P0-3] Day 11 醉酒剧情选项处理
  if (GS.day === 11 && GS.drunkTrigger) {
    // 女主醉酒：需要选人的选项
    if (GS.drunkTrigger === 'heroine' &&
        (opt.text.indexOf('照顾') >= 0 || opt.text.indexOf('阳台') >= 0 || opt.text.indexOf('客厅') >= 0)) {
      showDrunkMemberSelectModal(opt.text);
      return;
    }
    // 女主醉酒：和X单独对话（直接触发）
    if (GS.drunkTrigger === 'heroine' && opt.text.indexOf('X') >= 0) {
      await generateDrunkConsequence(opt.text, GS.secretX);
      return;
    }
    // X醉酒或攻略对象醉酒：直接生成后续
    if (GS.drunkTrigger !== 'heroine') {
      await generateDrunkConsequence(opt.text, GS.drunkTrigger);
      return;
    }
  }

  // Day 11 不限制选项次数（非真心话的普通剧情）
  var isDay11 = GS.day === 11;
  if (!isDay11 && GS.phaseChoiceCount >= MAX_PHASE_CHOICES) {
    alert('⚠️ 本时段选项次数已用完，请进入下一时段。');
    return;
  }

  if (!GS.aiEnabled) {
    alert('⚠️ AI 未启用，请先启用 AI。');
    return;
  }

  showLoading('正在生成后续剧情...');
  try {
    await compressTodayForInjection();
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('consequence', { choiceText: opt.text });
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.consequence);
    var parsed = parseNarrative(rawText);
    GS.consequenceNarratives.push({ rawText: rawText, parsed: parsed });
    GS.phaseChoiceCount++;
    if (!isDay11 && GS.phaseChoiceCount >= MAX_PHASE_CHOICES) parsed.options = [];
    GS.currentOptions = parsed.options;
    GS.isInConsequence = true;
    GS.todayFullText.push(rawText);
    triggerAffectionFromChoice(opt.text);
    saveGame();
    renderAll();
  } catch (e) {
    alert('⚠️ AI 生成失败：' + e.message + '\n请点击刷新按钮重试。');
  }
  hideLoading();
}

// ==================== Day 12 双向选择 ====================
function determineMemberChoice(memberId) {
  var aff = GS.affection[memberId] || 0;
  if (memberId === GS.secretX) {
    if (aff >= 60) return '选择了你（复合·他还爱着你）';
    if (aff >= 45) return '选择了你（复合·但内心仍有犹豫）';
    if (aff >= 30) return '选择了你（复合·更多是习惯和不舍）';
    if (aff >= 15) return '选择了回到过去（但表示"已经回不去了"）';
    return '选择了独自离开（他放下了）';
  }
  if (aff >= 60) return '选择了你（换乘·真心被你吸引）';
  if (aff >= 45) return '选择了你（换乘·但还在整理对前任的感情）';
  if (aff >= 30) return '选择了回到前任身边';
  if (aff >= 15) return '选择了独自离开';
  return '选择了独自离开';
}

function getEndingType(chosenId, memberChoices) {
  var chosenChoice = '';
  for (var i = 0; i < memberChoices.length; i++) {
    if (memberChoices[i].id === chosenId) {
      chosenChoice = memberChoices[i].choice;
      break;
    }
  }
  if (chosenChoice.indexOf('选择了你') >= 0) {
    return chosenId === GS.secretX ? '复合成功 ❤️' : '换乘成功 ❤️';
  }
  return '独自离开 💔';
}

async function handleFinalChoice(opt) {
  var members = GS.selectedMembers.map(function(id) {
    return MEMBERS.find(function(m) { return m.id === id; });
  });
  var xMember = members.find(function(m) { return m.id === GS.secretX; });
  var otherMembers = members.filter(function(m) { return m.id !== GS.secretX; });
  var chosenId = '';

  if (opt.text.indexOf(xMember.name) >= 0) {
    chosenId = GS.secretX;
  } else {
    for (var i = 0; i < otherMembers.length; i++) {
      if (opt.text.indexOf(otherMembers[i].name) >= 0) {
        chosenId = otherMembers[i].id;
        break;
      }
    }
  }

  var memberChoices = [];
  for (var j = 0; j < members.length; j++) {
    memberChoices.push({
      id: members[j].id,
      name: members[j].name,
      choice: determineMemberChoice(members[j].id)
    });
  }

  var chosenMember = members.find(function(m) { return m.id === chosenId; });
  var endingType = getEndingType(chosenId, memberChoices);
  var chosenMemberChoice = '';
  for (var k = 0; k < memberChoices.length; k++) {
    if (memberChoices[k].id === chosenId) {
      chosenMemberChoice = memberChoices[k].choice;
      break;
    }
  }

  var isMutual = chosenMemberChoice.indexOf('选择了你') >= 0;
  GS.finalChoice = isMutual ?
    ('你选择了 ' + chosenMember.name + '，' + chosenMember.name + '也选择了你 —— ' + endingType) :
    ('你选择了 ' + chosenMember.name + '，但' + chosenMember.name + chosenMemberChoice + ' —— ' + endingType);

  if (!GS.aiEnabled) {
    GS.gameOver = true;
    saveGame();
    renderAll();
    return;
  }

  showLoading('正在生成最终结局...');
  try {
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('finalResult', {
      choiceText: GS.finalChoice,
      memberChoices: memberChoices
    });
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.finalResult);
    var parsed = parseNarrative(rawText);
    GS.consequenceNarratives.push({ rawText: rawText, parsed: parsed });
    GS.currentOptions = [];
    GS.gameOver = true;
    saveGame();
    renderAll();
  } catch (e) {
    alert('⚠️ 结局生成失败：' + e.message + '\n请点击刷新按钮重试。');
  }
  hideLoading();
}

function triggerAffectionFromChoice(choiceText) {
  var members = GS.selectedMembers.map(function(id) {
    return MEMBERS.find(function(m) { return m.id === id; });
  });
  var targetMember = null;
  for (var i = 0; i < members.length; i++) {
    if (choiceText.indexOf(members[i].name) >= 0) {
      targetMember = members[i];
      break;
    }
  }
  if (!targetMember) targetMember = members[Math.floor(Math.random() * members.length)];

  var delta = randInt(2, 4);
  updateAffection(targetMember.id, delta);
  addAffectionLog(targetMember.id, delta, '你选择了与' + targetMember.name + '相关的行动');

  // 未选中者 -1
  var otherMembers = members.filter(function(m) { return m.id !== targetMember.id; });
  for (var j = 0; j < otherMembers.length; j++) {
    updateAffection(otherMembers[j].id, -1);
    addAffectionLog(otherMembers[j].id, -1, '未选中');
  }
}

async function handleRegenerate() {
  if (!GS.aiEnabled) {
    alert('⚠️ AI 未启用，请先启用 AI。');
    return;
  }

  if (GS.consequenceNarratives.length > 0) {
    var last = GS.consequenceNarratives.pop();
    popTodayFullText();
    GS.prevSummary = last && last.rawText ? last.rawText.slice(0, 200) : '';
    GS.prevRawText = last && last.rawText ? last.rawText : '';
    if (GS.consequenceNarratives.length === 0) {
      GS.currentOptions = GS.parsedNarrative.options;
      GS.isInConsequence = false;
      saveGame();
      renderAll();
    } else {
      GS.currentOptions = GS.consequenceNarratives[GS.consequenceNarratives.length - 1].parsed.options;
      saveGame();
      renderAll();
    }
  } else {
    var oldRaw = GS.phaseNarrative;
    GS.prevSummary = oldRaw ? oldRaw.slice(0, 200) : '';
    GS.prevRawText = oldRaw || '';
    popTodayFullText();
    await generatePhaseNarrative();
  }
}

async function advancePhase() {
  if (GS.dayCompleted) return;
  if (GS.phaseIndex < 3) {
    GS.phaseIndex++;
    resetPhaseState();
    saveGame();
    renderAll();
    await generatePhaseNarrative();
  } else {
    await goToNextDay();
  }
}

function resetPhaseState() {
  GS.phaseNarrative = '';
  GS.parsedNarrative = {
    narrative: '', directorOS: '', observerOS: '',
    interviews: [], memberInterviews: [], xInterviews: [], options: []
  };
  GS.consequenceNarratives = [];
  GS.currentOptions = [];
  GS.isInConsequence = false;
  GS.smsSentToday = false;
  GS.smsTarget = '';
  GS.smsDrafts = [];
  GS.stayCount = 0;
  GS.phaseChoiceCount = 0;
  GS.freeInput = '';
  GS.prevSummary = '';
  GS.prevRawText = '';
  GS.pendingDatingResult = null;
  GS.day10ChosenDate = null;
  GS.todayRandomEventTriggered = false; // [P1-5] 新的一天重置
}

async function goToNextDay() {
  if (GS.day >= 12) {
    if (GS.currentOptions.length > 0 && GS.currentOptions[0].text.indexOf('选择') >= 0) return;
    GS.gameOver = true;
    GS.finalChoice = '（请在最终选项中选择）';
    saveGame();
    renderAll();
    return;
  }

  showLoading('正在压缩今日记忆...');
  var summary = await compressTodayToSummary();
  hideLoading();
  if (summary) {
    var promises = extractPendingPromises(summary);
    var revealed = extractRevealedInfo(summary);
    // 使用非模态面板
    GS.pendingMemoryReview = {
      day: GS.day,
      summary: summary,
      promises: promises,
      revealed: revealed
    };
    saveGame();
    renderAll();
  } else {
    proceedToNextDay();
  }
}

async function proceedToNextDay() {
  GS.dailyFullTexts.push(GS.todayFullText.slice());

  // [P0-2] 约会后获得小礼物（Day 4 / Day 8）
  if ((GS.day === 4 || GS.day === 8) && GS.currentDatingPartner) {

      id: Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      type: tmpl.type,
      name: tmpl.name,
      desc: tmpl.desc,
      fromDay: GS.day,
      fromPartner: GS.currentDatingPartner
    });
  }

  // 清理未完成的秘密任务
  if (GS.secretMission && GS.secretMission.status === 'active') {
    GS.secretMission.status = 'failed';
    GS.secretMissionHistory.push(JSON.parse(JSON.stringify(GS.secretMission)));
    GS.secretMission = null;
  }

  GS.observerGuestPrevious = GS.observerGuest.split('（')[0];
  GS.day++;
  GS.phaseIndex = 0;
  GS.stayCount = 0;
  GS.todayFullText = [];
  GS._todayCompressedSummary = '';
  GS.observerGuest = '';
  GS.currentDatingPartner = null;
  GS.datingDiceResult = null;
  GS.pendingMemoryReview = null;
  GS.drunkTrigger = null;
  resetPhaseState();
  saveGame();
  renderAll();

  if (GS.aiEnabled && GS.dailySummaries.length > 0) {
    var lastSummary = GS.dailySummaries[GS.dailySummaries.length - 1];
    showImagePromptModal(lastSummary);

    else await generatePhaseNarrative();
  }
}

// ==================== 短信系统 ====================
async function sendSms(targetId, smsContent) {
  var targetMember = MEMBERS.find(function(m) { return m.id === targetId; });
  GS.smsSentToday = true;
  GS.smsTarget = targetId;
  GS.smsDrafts = [];
  GS.smsHistory.push({
    day: GS.day,
    target: targetId,
    name: targetMember.name,
    content: smsContent
  });

  updateAffection(targetId, 5);
  addAffectionLog(targetId, 5, '你发送了心动短信给' + targetMember.name);

  // 未收到短信者 -1
  var otherIds = GS.selectedMembers.filter(function(id) { return id !== targetId; });
  for (var i = 0; i < otherIds.length; i++) {
    updateAffection(otherIds[i], -1);
    addAffectionLog(otherIds[i], -1, '未收到短信');
  }

  if (!GS.aiEnabled) {
    saveGame();
    renderAll();
    return;
  }

  showLoading('正在发送短信...');
  try {
    await compressTodayForInjection();
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('sms', {
      targetName: targetMember.name,
      smsContent: smsContent
    });
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.sms);
    var parsed = parseNarrative(rawText);
    parsed.options = [];
    GS.consequenceNarratives.push({ rawText: rawText, parsed: parsed });
    GS.currentOptions = [];
    GS.todayFullText.push(rawText);
    saveGame();
    renderAll();
  } catch (e) {
    alert('⚠️ 短信生成失败：' + e.message + '\n请点击刷新按钮重试。');
  }
  hideLoading();
}

async function continueToday() {
  if (GS.stayCount >= MAX_STAY_COUNT) {
    alert('⚠️ 今日继续次数已用完（' + MAX_STAY_COUNT + '/' + MAX_STAY_COUNT + '）。');
    return;
  }
  GS.stayCount++;

  if (!GS.aiEnabled) {
    alert('⚠️ AI 未启用，请先启用 AI。');
    return;
  }

  showLoading('正在生成延伸剧情...');
  try {
    await compressTodayForInjection();
    var sysPrompt = buildSystemPrompt();
    var userMsg = buildUserMessage('stay');
    var rawText = await callDeepSeek(sysPrompt, userMsg, TOKEN_CONFIG.stay);
    var parsed = parseNarrative(rawText);
    GS.consequenceNarratives.push({ rawText: rawText, parsed: parsed });
    GS.currentOptions = parsed.options;
    GS.todayFullText.push(rawText);
    saveGame();
    renderAll();
  } catch (e) {
    alert('⚠️ 生成失败：' + e.message + '\n请点击刷新按钮重试。');
  }
  hideLoading();
}

        '<p style="font-size:11px;color:#8b6b6b;margin-bottom:6px">' + escHtml(g.desc) + '</p>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap">';
      for (var j = 0; j < members.length; j++) {
        var m = members[j];
        inner += '<button class="sms-target-btn" data-gift-idx="' + i + '" data-member-id="' + m.id + '">' +
          m.emoji + ' ' + m.name + '</button>';
      }
      inner += '</div></div>';
    }
  }
  inner += '<button class="modal-close" id="giftPanelClose">关闭</button></div>';
  overlay.innerHTML = inner;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
  overlay.querySelector('#giftPanelClose').addEventListener('click', function() {
    overlay.remove();
  });

  overlay.querySelectorAll('[data-gift-idx]').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var giftIdx = parseInt(this.dataset.giftIdx);
      var memberId = this.dataset.memberId;
      overlay.remove();
      await sendGift(memberId, giftIdx);
    });
  });
}

async function sendGift(memberId, giftIdx) {
  var gift = GS.gifts[giftIdx];
  if (!gift) return;
  var member = MEMBERS.find(function(m) { return m.id === memberId; });
  if (!member) return;

  showLoading('正在生成送礼剧情...');
  try {
    var sysPrompt = '你是《换乘恋爱》的短篇剧情生成AI。请根据以下信息，写一段约300字的送礼反应剧情。' +
      '女主把「' + gift.name + '」送给了' + member.name + '。' +
      '写出他的即时反应、对话、以及女主的感受。' +
      '只输出正文，不要写选项、不要写采访间、不要写导演OS、不要写观察员OS。';
    var reaction = await callDeepSeek(sysPrompt, '生成送礼剧情', 800);

    // 追加到当前叙事
    GS.phaseNarrative += '\n\n🎁 【送礼剧情】\n' + reaction;
    var parsed = parseNarrative(GS.phaseNarrative);
    GS.parsedNarrative = parsed;
    GS.currentOptions = parsed.options;

    // 好感度
    var bonus = 5;
    if (gift.type === 'food' && (member.id === 'mingyu' || member.id === 'dk')) bonus += 3;
    updateAffection(memberId, bonus);
    addAffectionLog(memberId, bonus, '收到礼物「' + gift.name + '」');

    // 未收到礼物的成员 -1
    var otherMembers = GS.selectedMembers.filter(function(id) { return id !== memberId; });
    for (var i = 0; i < otherMembers.length; i++) {
      updateAffection(otherMembers[i], -1);
      addAffectionLog(otherMembers[i], -1, '看到你送了礼物给别人');
    }

    // 移除已使用的礼物
    GS.gifts.splice(giftIdx, 1);
    saveGame();
    renderAll();
  } catch (e) {
    alert('⚠️ 送礼剧情生成失败：' + e.message);
  }
  hideLoading();
}

// [P1-4] 非阻塞 Toast 提示
function showToast(message) {
  var toast = document.createElement('div');
  toast.style.cssText = 'position:fixed;top:20px;left:50%;transform:translateX(-50%);' +
    'background:#333;color:#fff;padding:10px 18px;border-radius:20px;font-size:13px;' +
    'z-index:3000;opacity:0;transition:opacity .3s;box-shadow:0 2px 8px rgba(0,0,0,.2);';
  toast.textContent = message;
  document.body.appendChild(toast);
  requestAnimationFrame(function() { toast.style.opacity = '1'; });
  setTimeout(function() {
    toast.style.opacity = '0';
    setTimeout(function() { toast.remove(); }, 300);
  }, 2000);
}

// ==================== 历史剧情回顾面板 ====================
function showHistoryModal() {
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var inner = '<div class="modal-content" style="width:520px;max-width:98vw"><h3>📖 历史剧情回顾</h3>';

  var totalDays = GS.dailyFullTexts.length;
  if (totalDays === 0) {
    inner += '<p style="color:#8b6b6b;text-align:center;padding:20px 0">暂无历史剧情（当前为 Day 1）</p>';
  } else {
    inner += '<div class="history-tabs" id="historyTabs">';
    for (var d = 0; d < totalDays; d++) {
      inner += '<button class="history-tab' + (d === totalDays - 1 ? ' active' : '') +
        '" data-day="' + d + '">Day ' + (d + 1) + '</button>';
    }
    inner += '</div><div class="history-content" id="historyContent"></div>';
  }

  inner += '<button class="modal-close" id="historyClose">关闭</button></div>';
  overlay.innerHTML = inner;
  document.body.appendChild(overlay);

  function showDayContent(dayIdx) {
    var content = document.getElementById('historyContent');
    if (!content) return;
    var texts = GS.dailyFullTexts[dayIdx] || [];
    var html = '';
    for (var i = 0; i < texts.length; i++) {
      var parsed = parseNarrative(texts[i]);
      html += renderParsedNarrative(parsed);
      if (i < texts.length - 1) html += '<div class="separator"></div>';
    }
    content.innerHTML = html;
  }

  if (totalDays > 0) showDayContent(totalDays - 1);

  overlay.querySelectorAll('.history-tab').forEach(function(tab) {
    tab.addEventListener('click', function() {
      overlay.querySelectorAll('.history-tab').forEach(function(t) { t.classList.remove('active'); });
      this.classList.add('active');
      showDayContent(parseInt(this.dataset.day));
    });
  });

  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) overlay.remove();
  });
  overlay.querySelector('#historyClose').addEventListener('click', function() {
    overlay.remove();
  });
}

      inner += '<p style="font-size:12px;color:#8b6b6b">（暂无变化记录）</p>';
    } else {
      var recentLogs = logs.slice(-3);

    overlay.remove();

// ==================== 心动笔记面板 ====================
function showHeartNotesModal() {
  var members = GS.selectedMembers.map(function(id) {
    return MEMBERS.find(function(m) { return m.id === id; });
  });
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';

  var inner = '<div class="modal-content" style="width:480px;max-width:98vw"><h3>📝 心动笔记</h3>' +
    '<p style="font-size:12px;color:#8b6b6b;margin-bottom:10px">随着好感度提升和秘密任务完成，逐步解锁成员的隐藏细节。</p>';

  var hasAnyNote = false;
  for (var i = 0; i < members.length; i++) {
    var m = members[i];
    var notes = GS.heartNotes[m.id] || [];
    var allTemplates = HEART_NOTE_TEMPLATES[m.id] || [];
    if (notes.length > 0) hasAnyNote = true;
    inner += '<div style="background:#fff5f5;border-radius:12px;padding:12px;margin-bottom:10px">' +
      '<p style="font-weight:700;font-size:15px;margin-bottom:6px">' + m.emoji + ' ' + m.name + ' <span style="font-size:12px;color:#8b6b6b">（' + notes.length + '/' + allTemplates.length + '）</span></p>';
    if (notes.length === 0) {
      inner += '<p style="font-size:12px;color:#8b6b6b">（尚未解锁）</p>';
    } else {
      for (var j = 0; j < notes.length; j++) {
        var note = notes[j];
        inner += '<div style="background:#fff;border-radius:8px;padding:8px;margin-bottom:6px;border-left:3px solid #e91e63">' +
          '<p style="font-size:13px;color:#5d3a3a;margin:0">' + escHtml(note.text) + '</p>' +
          '<p style="font-size:10px;color:#8b6b6b;margin-top:4px">解锁于 Day ' + (note.unlockedAt ? note.unlockedAt.day : '?') + ' · 任务「' + (note.unlockedAt ? escHtml(note.unlockedAt.mission) : '') + '」</p></div>';
      }
    }
    inner += '</div>';
  }

  if (!hasAnyNote) {
    inner += '<p style="color:#8b6b6b;text-align:center;padding:20px 0">还没有解锁任何心动笔记。<br>完成秘密任务可以提升好感并解锁笔记。</p>';
  }

  if (GS.secretMissionUnlockFinal) {
    inner += '<div style="background:linear-gradient(135deg,#fce4ec,#f8e8e8);border-radius:12px;padding:12px;margin-bottom:10px;border:2px solid #e91e63">' +
      '<p style="font-weight:700;font-size:14px;color:#c2185b;margin-bottom:6px">💌 特殊解锁：X 的未寄出的信</p>' +
      '<p style="font-size:12px;color:#5d3a3a;line-height:1.7">你在节目中完成了所有秘密任务，制作组在最后一天交给你一封信——是X在参加节目前写下的，从未寄出。<br><br>' +

  }

  inner += '<button class="modal-close" id="heartNotesClose">关闭</button></div>';

  });
