<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>泡泡聊天室预览 · Bubble Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a2e;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; font-family: -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
}

/* ── 手机外框 ── */
.phone {
  width: 390px; max-width: 100vw;
  background: #16213e;
  border-radius: 28px; overflow: hidden;
  box-shadow: 0 0 40px rgba(124,111,240,.25), 0 0 80px rgba(0,0,0,.4);
  position: relative;
}

/* ── 顶部信息栏 ── */
.bubble-header {
  background: linear-gradient(135deg, #1c1c3a 0%, #2a1a3a 100%);
  padding: 16px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid rgba(124,111,240,.15);
}
.bubble-header-left { display: flex; align-items: center; gap: 10px; }
.bubble-avatar {
  width: 38px; height: 38px; border-radius: 50%;
  background: linear-gradient(135deg, #ff8ec8, #7c6ff0);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.bubble-info .name { font-size: 14px; font-weight: 700; color: #ffb8d4; }
.bubble-info .sub {
  font-size: 11px; color: rgba(255,200,220,.5);
  display: flex; gap: 10px;
}
.bubble-stats {
  display: flex; gap: 8px; font-size: 11px; color: rgba(255,200,220,.6);
}
.bubble-stats b { color: #ffb8d4; }

/* ── 聊天区域 ── */
.bubble-chat {
  padding: 14px 12px;
  height: 420px; overflow-y: auto;
  background: linear-gradient(180deg, #1a1a3a 0%, #12122a 100%);
  display: flex; flex-direction: column; gap: 10px;
}
.bubble-chat::-webkit-scrollbar { width: 4px; }
.bubble-chat::-webkit-scrollbar-thumb { background: rgba(124,111,240,.25); border-radius: 4px; }

/* ── 时间分隔线 ── */
.bubble-time {
  text-align: center; font-size: 10px; color: rgba(255,255,255,.25);
  padding: 6px 0; letter-spacing: 1px;
}

/* ── 我的消息（靠右·粉色） ── */
.bubble-msg { display: flex; align-items: flex-end; gap: 6px; }
.bubble-msg.me { flex-direction: row-reverse; }
.bubble-msg.me .bubble-bubble {
  background: linear-gradient(135deg, #d87ab8, #c462a6);
  color: #fff; border-radius: 18px 18px 4px 18px;
}

/* ── 粉丝消息（靠左·灰色） ── */
.bubble-msg.fan { flex-direction: row; }
.bubble-msg.fan .bubble-bubble {
  background: rgba(255,255,255,.08);
  border: 1px solid rgba(255,255,255,.06);
  color: rgba(255,255,255,.8);
  border-radius: 18px 18px 18px 4px;
}

/* ── 气泡本体 ── */
.bubble-bubble {
  max-width: 78%; padding: 10px 14px;
  font-size: 13px; line-height: 1.6;
  word-break: break-word;
  animation: bubbleIn .35s cubic-bezier(.2,.8,.2,1);
}
@keyframes bubbleIn {
  from { opacity: 0; transform: translateY(12px) scale(.92); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* ── 粉丝名标签 ── */
.bubble-name {
  font-size: 10px; color: rgba(255,200,220,.5);
  margin-bottom: 3px; padding-left: 4px; font-weight: 600;
}
.bubble-msg.fan .bubble-name { text-align: left; }

/* ── 底部发送区 ── */
.bubble-footer {
  padding: 10px 14px 14px;
  background: #1c1c3a;
  border-top: 1px solid rgba(124,111,240,.1);
  display: flex; align-items: center; gap: 8px;
}
.bubble-input {
  flex: 1; padding: 10px 14px;
  border-radius: 20px; border: 1px solid rgba(124,111,240,.2);
  background: rgba(255,255,255,.04); color: #e6e1f5;
  font-size: 13px; outline: none; transition: border .2s;
}
.bubble-input:focus { border-color: rgba(255,184,212,.4); }
.bubble-input::placeholder { color: rgba(255,255,255,.2); }
.bubble-send {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #ff8ec8, #d87ab8);
  border: none; color: #fff; font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, opacity .2s;
  flex-shrink: 0;
}
.bubble-send:hover { transform: scale(1.08); }
.bubble-send:disabled { opacity: .35; cursor: not-allowed; transform: none; }
.bubble-limit-label {
  font-size: 10px; color: rgba(255,255,255,.25);
  text-align: center; padding: 2px 0; display: none;
}

/* ── 加载动画 ── */
.bubble-sending {
  display: flex; align-items: center; justify-content: center;
  padding: 14px; gap: 6px;
}
.bubble-sending .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: #ff8ec8; animation: bounce 1.2s infinite ease-in-out;
}
.bubble-sending .dot:nth-child(2) { animation-delay: .15s; }
.bubble-sending .dot:nth-child(3) { animation-delay: .3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(.6); opacity: .4; }
  40% { transform: scale(1.2); opacity: 1; }
}

.preview-badge {
  position: absolute; top: 8px; right: 12px;
  background: rgba(124,111,240,.3); color: rgba(255,255,255,.5);
  font-size: 10px; padding: 2px 8px; border-radius: 50px;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="phone" id="app">
  <div class="preview-badge">PREVIEW</div>
  <!-- 头部 -->
  <div class="bubble-header">
    <div class="bubble-header-left">
      <div class="bubble-avatar">💜</div>
      <div class="bubble-info">
        <div class="name">沈也的泡泡</div>
        <div class="sub">
          <span>订阅 <b id="subCount">847</b>人</span>
          <span>· 连续 <b id="streakDays">12</b>天</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 聊天记录区 -->
  <div class="bubble-chat" id="chatArea"></div>

  <!-- 底部发送 -->
  <div class="bubble-footer">
    <input class="bubble-input" id="msgInput" placeholder="给粉丝发条消息…" maxlength="60"
      onkeydown="if(event.key==='Enter')sendDemo()">
    <button class="bubble-send" id="sendBtn" onclick="sendDemo()">✉</button>
  </div>
  <div class="bubble-limit-label" id="limitLabel">今日消息已发满</div>
</div>

<script>

var demoHistory = [

  { me: false, text: '姐姐今天也辛苦了！！看了练习室视频，你们的刀群舞真的绝了 😭💕', name: '出道粉' },
  { me: false, text: '练习的时候有好好吃饭吗？感觉你又瘦了，好担心…', name: '仓鼠饲养员' },
  { me: false, text: '你们在待机室打闹的画面太可爱了哈哈哈，团魂满满', name: '星星眼' },
  { me: false, text: '新歌什么时候出啊，等不及了，每次预告都翻来覆去看八百遍', name: '素妍' },
  { me: true,  text: '刚拍的自拍！想你们了~', time: '16:08' },
  { me: false, text: '哇自拍美貌疯了，心脏受不了，太美了真的', name: '小糖果' },
  { me: false, text: '已经设置成手机壁纸了 ^^', name: '露娜' },
  { me: false, text: '姐姐今晚七点直播对吧？闹钟已经定好了 🥹', name: '草莓牛奶' }
];

var todayCount = 1;
var maxDaily = 5;

// 初始化渲染
(function init() {
  renderAll();
})();

function renderAll() {
  var html = '';
  demoHistory.forEach(function(m, i) {
    html += renderBubble(m, i);
  });
  document.getElementById('chatArea').innerHTML = html;
  scrollBottom();
  updateSendState();
}

function updateSendState() {
  var input = document.getElementById('msgInput');
  var btn = document.getElementById('sendBtn');
  var limit = document.getElementById('limitLabel');
  if (todayCount >= maxDaily) {
    input.disabled = true;
    input.placeholder = '今日已发满 5 条';
    btn.disabled = true;
    limit.style.display = '';
  } else {
    input.disabled = false;
    input.placeholder = '给粉丝发条消息…';
    btn.disabled = false;
    limit.style.display = 'none';
  }
}

function renderBubble(m, idx) {
  if (m.me) {
    return '<div class="bubble-msg me" style="animation-delay:' + (idx * .05) + 's">' +
      '<div class="bubble-bubble">' + escHtml(m.text) + '</div>' +
    '</div>';
  }
  return '<div class="bubble-msg fan" style="animation-delay:' + (idx * .05) + 's">' +
    '<div>' +
      '<div class="bubble-name">' + escHtml(m.name || '匿名粉丝') + '</div>' +
      '<div class="bubble-bubble">' + escHtml(m.text) + '</div>' +
    '</div>' +
  '</div>';
}

function scrollBottom() {
  var el = document.getElementById('chatArea');
  if (el) el.scrollTop = el.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── 模拟发送 ──
function sendDemo() {
  var input = document.getElementById('msgInput');
  var text = input.value.trim();
  if (!text || todayCount >= maxDaily) return;

  todayCount++;
  input.value = '';
  input.disabled = true;
  document.getElementById('sendBtn').disabled = true;

  // 1. 添加用户消息
  appendMsg({ me: true, text: text });

  // 2. 显示 loading
  var loadingHtml = '<div class="bubble-sending" id="sendingDots">' +
    '<span style="font-size:11px;color:rgba(255,255,255,.3);margin-right:6px">发送中</span>' +
    '<span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  document.getElementById('chatArea').insertAdjacentHTML('beforeend', loadingHtml);
  scrollBottom();

  // 3. 模拟 AI 返回
  var delay = 1200 + Math.random() * 1400;
  setTimeout(function() {
    var dots = document.getElementById('sendingDots');
    if (dots) dots.remove();

    var replyCount = 2 + Math.floor(Math.random() * 3);
    for (var i = 0; i < replyCount; i++) {
      appendMsg({
        me: false,
        text: genFanReply(),
        name: FAN_NAMES[Math.floor(Math.random() * FAN_NAMES.length)]
      });
    }

    // 更新订阅数
    var sub = document.getElementById('subCount');
    var cur = parseInt(sub.textContent);
    sub.textContent = cur + (Math.random() < 0.15 ? -Math.floor(Math.random() * 3) : Math.floor(Math.random() * 5) + 1);

    // 更新发送状态
    updateSendState();
    if (todayCount < maxDaily) document.getElementById('msgInput').focus();
  }, delay);
}

function appendMsg(m) {
  document.getElementById('chatArea').insertAdjacentHTML('beforeend', renderBubble(m, 0));
  scrollBottom();
}

</script>
