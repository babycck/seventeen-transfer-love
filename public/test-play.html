*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#1a1a2e;color:#e0d7f5;min-height:100vh;font-size:15px}

.btn-skip{background:#333;color:#aaa}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:100}
.overlay-box{background:#16213e;padding:24px;border-radius:12px;text-align:center;max-width:360px}
.overlay-box h2{color:#ff6b9d;margin-bottom:12px}
.overlay-box p{color:#aaa;margin:6px 0;font-size:13px}
.overlay-box button{margin-top:14px;padding:10px 24px;background:#e94560;border:none;border-radius:6px;color:#fff;font-weight:bold;cursor:pointer;font-size:15px}

<script>

触目惊心。","Dispatch特辑：{name}出道以来的绯闻对象——里面列了五六位不同圈内人。","Dispatch直击——{name}和{maleLead}在某颁奖礼后台擦肩而过时交换了一个眼神。时长不到一秒。但被拍成了连拍。","Dispatch独家：{name}练习室自拍背景中出现男性背影——被扒出是{maleLead}的造型师。"],"DRAMA_ALMOST":["他深吸一口气打算开口了。门开了——队友进来拿东西。\"哦你们在聊天？不好意思。\"气氛碎了一地。他张着的嘴合上了——那句话还悬在他舌尖上。","他刚说\"你知道我一直——\"电话断了。信号不好。你盯着屏幕——没等他打回来。五分钟后他发了一条文字：刚才那句我还是想亲口说。下次吧。","你们站在同一个走廊。他往前一步。近到你数得清他的睫毛。他说\"如果我现在说——\"你的手机响了。你恨透了那个铃声。","你写了一封很长的草稿。没有发送——存进了备忘录。那个锁屏密码是你自己。第二天他看到你亮手机时眼角扫到了一行字。他没提。但那天他看你的眼神柔和了很多。","庆功宴他喝了酒。你没喝。散场后他在出租车后排靠窗，忽然很轻地说了一句。你转头问他你说什么——车窗外的街灯扫过他的脸。他闭着眼睛说\"算了\"。","你们在咖啡馆坐到打烊。店员开始拖地。他放下杯子说\"现在说可能太晚了\"。你等着他继续。他说\"但我还是想说\"。店员关了一盏灯——他又停住了。你们走出店门的时候这句话还卡在喉咙里。","他送你到宿舍楼下。你解开安全带。他的手停在方向盘上。你感觉他要说话——他转过头看着你。车载音响刚好切到下一首歌。那首歌你们都不认识。他又把头转回去了。","他让你闭上眼睛说给你听首歌。你闭了。音乐没响。你睁开一条缝——他正在看你。他说\"算了，这歌还不够好\"。你不知道他说的到底是歌还是话。","楼梯间里没有人。他站在你身后两级台阶。\"有件事我练了很久——不是为了舞台。\"你不知道是他的呼吸声还是你的心跳声更响。然后楼上有个脚步声——他把那句话咽回去了。","节日烟花。你们并肩站在楼顶。他说了一句话，第一波烟花响了。你喊\"什么？！\"他说\"没——\"第二波烟花。他笑了。你觉得他不是在说\"没\"。","他在教你一段舞步。手放在你腰上帮你加角度。音乐停了。他的手没放下来。\"我——\"然后你室友进来了。他的手收了回去。但刚才那个角度，你到现在还记得。"],"DRAMA_COLDWAR":["你们冷战了。起因是你觉得他那天看了你一眼就走了。他说他没有。两个人都没有说话——各自滑着手机。第三天你锁屏是他以前的照片。","冷战第二天。他在练习室门口晃了一下——手里端着一杯热茶。放在门口墙边。十分钟后你经过的时候茶已经凉了。你端起来喝了。","三天没有说话。第四天你去哥哥那里的时候碰见他。空气很重。哥哥说\"你们俩——\"他没有把话说完。因为你们同时起身离开了房间。","哥哥把你叫到一边。他说\"你们闹什么？他这几天状态都很不对。\"你没接话。他又说\"你知道他会先低头的——但你是不是也该给个台阶？\"","你们在电梯里——谁都没说话。他到楼层了没有下去。电梯门关上后再往下。——他开口了:\"我错了\"。你看着镜子里的他说\"我也错了\"。你们到一楼的时候都想不起上去要干嘛了。","冷战第四天。他在泡泡里发了一首翻唱——是一首关于道歉的歌。粉丝以为他只是想唱歌。你知道那首歌。那次你们一起在车里听过。","工作人员都感觉到你们不对劲。化妆师给你描眉的时候说今天那位在门口晃了一下又走了。你看着镜子里的自己——眉毛画了歪。你让她擦掉重新来。","冷战第五天。他的演唱会上——你在台下。他唱了一首不是歌单上的歌。是你最喜欢的。MC环节他说\"这首歌今天临时加的——送给一个最近没怎么跟我说话的人。\"全场尖叫。你手机在震——哥哥发了消息:他在台上说的就是你吧。","冷战第三天。你练习室的椅子上多了一个小盒子。打开是喉糖——你上周说过嗓子不舒服的牌子。没有署名。但你认出了包装纸上的便利店贴纸——那家店只在他公司楼下。","冷战期间下雨了。你们在停车场隔着几辆车各自避雨。他先撑开了伞——没有走。那把伞斜了一点——遮住了你站的位置。雨停的时候你们还没说话。但伞一直歪着。"],"DRAMA_DATING_RUMOR":["Dispatch发了预告——\"某大势男团成员×新人女团成员\"。时间线、地点、证据——一一对上了你们。你的经纪人第一时间打了电话。","公司发了声明：两人只是前后辈关系。你在待机室看着那份声明——它像一座透明的墙。你知道你再也不能在走廊停下来了。","粉丝分成两派：一派\"造谣不约\"，一派拿出了六张对比图。你刷着评论。他在泡泡写了很长一段话——没有指名道姓，但你知道他在安抚那些爱他的人。包括你。","你们都选择了沉默。不是商量好的——是各自的公司给的建议。你们隔着沉默传递信息。他看到你今天的泡泡写了\"会一直感恩的\"。你看到他明天的官咖写了\"尽力保护应该保护的人\"。","一次的同框被放大；第二次被拍到就在同一家公司楼下；第三次——没有人说是谣言了。你不是不在乎。你是没有选择。但你握住了他的手。","待机室走廊的监控截图被人发到了论坛——画面里你们站得很近地在说话。你说了不到三秒的话。但截图看起来像十分钟。公司让你和经纪人对口径——其实没什么好对的。那三秒里你只问了他今晚有没有空。","私生拍了你们在停车场的照片——脸部打了码但衣服完全对得上。论坛热度比回归新闻还高。你第一次收到经纪人发来的pr危机手册——不像是手册，像是解剖刀。","妈妈打电话来问——她说在网上看到了。你知道妈妈不喜欢八卦新闻，但她还是问了。你说是误会。挂了电话你在练习室哭了。不是伤心——是你第一次对你妈说谎。","CP粉建了站子。有画手画了你们俩的同人图。你刷到的时候刚好在待机室，队友也看到了。她说这画得还挺好。你不知道该笑还是该怕。但图确实画得很好——那条围巾的颜色，和他穿过的那条一模一样。","他在公开采访里被问到了那些传闻。他说\"和那位前后辈很尊重彼此\"。主持人追问\"所以是假的？\"他笑了——但你没见过那种笑。不是营业。是藏着东西的笑。回宿舍后你收到他的消息：我回答对了吗。你看着屏幕不知道该怎么回。"],"DRAMA_DILEMMA":["你今天有个重要的试镜——和他的演唱会同一天。他从来没有要求你去看他的演唱会，但他的消息变成了\"你知道晚上八点体育馆会亮什么颜色的灯吗\"。你看着试镜时间表没有回他。","回归期撞上了你和他的唯一可以约会的机会。你很犹豫。经纪人问你在想什么，你说在想舞台走位。你没有说谎——你确实也在想。","公司要送你去海外培训三个月。你看着那份告知书——需要签字。他那天晚上在泡泡发了首歌。是关于等待的。他艾特了所有人——其中也包括你。","你有个出个人专辑的机会。但另一方面——放弃团体活动意味着你很难见到他了。你在想到底是你追你的梦把他也放在梦里，还是停下来让他陪你走。","经纪公司问你们愿不愿意公开——不是逼迫，是征求意见。你看着他的眼睛。他说由你来决定。你看着他的眼睛——那里装着你们之间的全部。","公司提议把你转到另一个分部——离主公司很远。好处是资源会多。坏处是你再也不会有理由\"碰巧\"出现在他公司附近了。你在签约前给他发了消息。他回了一个问号。然后打来了电话。","团里要拆小分队。你在名单上——但小分队的行程和你与他的交集窗口会完全错开。你看着那份名单——如果签了，你们三个月见不到面。他知道了以后什么都没说。但他的歌单忽然多了一首关于远距离的歌。","综艺邀约：以你的感情经历为话题的谈话节目。薪酬很高——但你会被问到有没有喜欢的人。你知道回答\"有\"或\"没有\"都会是谎言。你问他意见。他沉默了一会儿说：去吧。你想说的都可以说。他说的可能不是综艺的事。","合约到期——你要决定续约还是去别的公司。另一家公司开的条件更好。但是他和现在这家公司有关系。你翻来覆去地想——这不是选公司。这是选能见到他的路。"],"DRAMA_MISUNDERSTAND":["你看到一张路透——他和另一位女艺人走得很近。你放大图片看了很久——其实只是同组工作人员。但你心里还是揪了一下。晚上他发消息问你怎么不回他——你说忘了。","有人在传情敌和你走得近。他听到了。今天他对你特别冷淡——不是冷战，是那种很礼貌的疏远。你在他官咖评论下看到他在线了很久。","你不小心把发给哥哥的消息发给了他——内容是在说\"他\"最近的状态。他回了一个问号。你看着那个问号，用最快的速度解释了好长一段。他的回复只有一个字：哦。","采访里你说\"最近身边有很多值得珍惜的人\"——被剪成\"最近身边有很多人\"。他看到了那个剪辑。你知道他看到了。","你们已经两天没怎么说话了。不是吵架——是某种沉默的冷战。你其实不知道原因是什么。但今晚你打开手机的时候他在线。你发了一条\"吃饭了吗\"。他秒回：吃了。你又发：所以为什么生气。这次他卡了很久。","他给你的ins点了赞——但只点了这一次。之前的帖子全部没赞。你翻遍了他所有的点赞记录发现他只赞了一条。你问他为什么是那条。他说\"那条是我看到的时候觉得你说的是实话\"——但你以为他在说别的。","粉丝拍到你和他在同一家咖啡馆——但不是同一天。是两张不同日子的照片被拼在一起。标题脑补了一大堆。他看到那个帖子的时候你正在生他的气——因为另一个完全无关的原因。现在两个人的聊天都停在一个尴尬的地方。","他在泡泡里发了一个词——是你随口提过的。但你也跟情敌提过同样的词。他不知道。你看到消息的时候先是开心，然后是崩溃。因为你觉得他可能知道了你跟情敌也说过这个词。但其实他没有——这是一个完全巧合的误会。","有个假号在模仿你的说话方式给他留评论——内容暧昧。他看到后截图发给你问\"这是你吗\"。你说不是。他说好。但你感觉得到他没有完全信。那个句号后面的沉默比任何话都长。","你说今天有行程所以不能见他。其实行程取消了——你只是想自己待着。但他在路上看到了你的队友。队友说\"今天全员休息\"。晚上他发了一句：今天休息得怎么样。你知道他知道了。"],"ENCOUNTER_BROTHER":["你的手机忘在练习室。哥哥捡起来的时候刚好屏幕亮了——是他的消息预览。哥哥看着你。你没接手机。两个人在安静中达成了一种不需要明说的默契。","他送你的手链从袖口滑出来了。哥哥的眼神落在你手腕上停了半秒。你没解释。他没有问。但晚上他发了条消息：那个...是他送的吧。","哥哥把你拉到楼梯间。\"你们俩——是不是有什么事情我应该知道？\"你看着他的眼睛。他没有生气。他是那种\"我早就感觉到但是等你主动说\"的表情。","哥哥推开练习室门的时候你们正在说话。两个人都迅速后退了半步——此地无银。哥哥说\"打扰了\"，然后出去了。他关上门的时候轻得离谱。","和哥哥同车的时候他忽然开口：\"最近...我们成员里有谁经常跟你联系吗？\"你看着窗外。\"没有啊。\"\"嗯。\"他又沉默了。但是你没看到他在后视镜里微微翘起的嘴角。"],"ENCOUNTER_ML":["他\"刚好\"路过你的练习室。说他来找哥哥。但哥哥今天不在公司——他在放送局。你也没戳穿他。两个人对视了一下，他挠了挠后脑勺走了。","你在公司附近的咖啡馆看到他在排队。他看见你的时候明显愣了一下——然后极其自然地加了一杯拿铁。你的口味。","两团的行程车在同一个停车场。你在后座看到他钻进了对面的车门。两个人隔着两辆车的距离快速交换了一个眼神——然后像什么都没发生一样各自出发。","他今天出现在你们公司——说是来找哥哥。但来了以后在走廊待了很久。哥哥出来的时候一头雾水：\"你找我？\"他说\"嗯，顺便看看别的\"。","你在回放监视器看今天的舞台表现。门开了——是他。两个人一起看了大约三十秒的无声画面。他说\"第三段可以再放开一点\"。你没有反驳。","深夜。电梯里只有你一个人往下。门打开的时候他在外面——没有进来的意思，但也没让开。你们对视了几秒。\"按关门键吧，\"你说。他没动。","凌晨你从便利店出来，他在路灯下——手里也拎着塑料袋。两个人都笑了。\"你也来买夜宵？\"\"嗯。\"\"买什么？\"\"...跟以前一样。\"","今天因为一个合作企划你需要去他公司的练习室。他去开门的时候你站在走廊里——空气里全是他练习室的香味。他在门后说\"进来吧\"。你进去的时候椅子旁边已经放好了一杯水。","公司楼顶的晒衣区——他也在晾衣服。你们间隔了几排被子。有一床被单被风吹起来的时候他刚好看见了你。他笑了一下——夹着衣夹的手停在了半空中。","自动贩卖机旁边的排行分数——你们在偷偷竞争谁买得更多。他今天在上面多贴了一张贴纸。不是你喜欢的图案。但你知道是他贴的——因为只有他会在练习生楼层用那种贴纸。","电台节目——你走出去透气的时候他正在走廊拐角靠着墙。他不是这期节目的嘉宾。他说\"我的录制在十点\"。现在才七点。你说\"你来早了三个小时\"。他说\"嗯\"。","暴雨。你在停车场等经纪人开车过来。他从另一个方向走过来——外套没有帽子，头发湿了。你举高了伞。他说\"不用\"——但他已经站在了伞下面。你的肩膀和他的肩膀只差一点点。","健身房——凌晨五点半。你推门进去的时候他在跑步机上。两个人都停下了动作。\"你平时也这么早？\"\"...不是。\"其实你今天是第一次这么早。他大概也是。","公司团建去练歌房。你出来透气的时候隔壁的门也开了——是他。原来两团选了彼此隔壁的包间。走廊里两个人都笑了。你们的歌单大概重叠了一半。"],"ENCOUNTER_OTHERS":["队友今天忽然问\"你最近是不是有情况？\"你正在喝水，被呛到咳了好几下。她说\"我随便问问的——你这个反应已经给了答案。\"","化妆师给你描眼线的时候忽然说\"最近看你的眼神跟以前不一样——是那种想到某个人自然流露的眼神。\"你维持了表情管理，什么也没说。","一位前辈经过待机室的时候停在你旁边：\"我在网上看到你们的互动了——镜头没拍到但是有感觉。\"你僵住了。她笑了笑：\"别紧张，这个圈子大家都懂。\"","两个工作人员在你身后小声说\"你和XX是不是...\"——她们的音量控制得刚好让你听到。你假装在整理鞋子。回头的时候她们已经不说话了。","综艺录制中的某个环节主持人忽然看着你说\"你今天好像特别开心——是人逢喜事吗？\"你愣了一下笑着说\"因为今天天气好\"。现场的观众笑着不知道其实你说谎的时候耳朵会红。","宿管阿姨今天忽然问你\"最近经常晚回来的不止你一个人吧\"。你正在签晚归记录——笔停了一下。阿姨笑了一下没再说。但是那个笑很慈祥。","公司保安大叔今天忽然送你一瓶水。\"门口那个小伙子等了你三十多分钟，让我把这个转交。\"你愣了一下——大叔指了指监控屏幕。画面静止的。水还是温的。","外卖小哥敲开门的时候手里拿着两杯咖啡。\"那位先生说是给您的。\"你说谁。他说\"就楼下站着那个——没告诉我名字。\"你跑到窗边往下看——路灯下有个影子转身走了。","今天的舞台摄影师在回放的时候停住了。\"你们两团的镜头我总是忍不住放在一起。\"他看着监视器。\"就是你们之间有种——怎么说——你们站在一起的时候画面就对了。\""],"ENCOUNTER_RIVAL":["走廊里你、情敌和他三个人刚好碰上。空气静止了一秒。哥哥刚好也路过——看得出来他在憋笑。你假装在跟哥哥说话。情敌在跟他说练习室的事情。只有他站在那看着你。","情敌很自然地走过来帮你调了耳返——你还没说谢谢，他已经站在你们练习室门口了。那种氛围像是一件谁都不想先穿的外套。","你在等电梯。他也在等。情敌走了过来——站在你们中间。电梯下来的时候三个人一起进去。镜子里的画面简直可以当电视剧海报：你在左，他在右，情敌在正中。","情敌今天给你带了咖啡。不是偶然——他知道你喜欢喝哪家。你接过来的时候他刚好从转角出来。他看到你手里的杯子。什么都没说。但那天的消息回复速度特别慢。","合作舞台。三个人都需要排练。老师排位置的时候——你被安排在中间。两个人在你身边。你专注地听节拍——不要思考空气里谁来谁走的差别。"],"EXTERNAL_HOT":["#BTS十周年企划公开#","#BLACKPINK世巡加场#","#IVE新歌MV破亿#","#NewJeans代言官宣#","#aespa回归概念照#","#LE_SSERAFIM练习室公开#","#某男团成员深夜出入Club#","#新人女团出道即百万销量#","#音源榜单争霸战再燃#","#KBS年末颁奖礼选址争议#","#SM新男团即将出道#","#YG新女团预告引热议#","#JYP股价连续上涨#","#HYBE收购新厂牌#","#打歌节目改革投票制#","#粉丝抗议应援棒涨价#","#音银MC换人#","#SEVENTEEN完整体回归#","#夫胜宽综艺名场面#","#{rival}画报公开#"],"FANSIGN_POOL":["视频签售——屏幕上出现了一个小女孩。她妈妈在旁边说\"是她最喜欢的偶像。\"小女孩什么话都没说——只是把脸贴在屏幕上。你也把脸贴上去。两张脸隔着玻璃贴在了一起。","有粉丝让你对镜头比心——你比了。然后你让她也比一个。\"对——就这样——你以后也要对别人做这个。\"\"我只会对你做。\"\"那你比完记得收起来——别乱给别人。\"你笑着说。她笑了。然后她真的收起来了——双手合十。好像真的可以收。","一进会场看到某个粉丝座位上放着一个袋子——里面是六个不同颜色的蝴蝶结发箍。\"是给我们一人一个？\"粉丝点头。你戴上了紫色的——然后给其他人分配。最小的队友说:\"我是粉色——\"\"对，因为你最小。\"她嘟嘴。但不高兴是假的。","有个粉丝没让你签名——让你在她的手账本上画一朵花。\"以后看到这朵花——我就觉得你在鼓励我。\"你画了一朵。然后多加了一片叶子。\"这是明天的。提前给你。\"","有人送你一条自己织的围巾。说第一次织——不好看。你当场围上了，镜子前转了一圈。\"不好看的才珍贵。因为只有一条。\"","妈妈带着女儿来——妈妈说女儿生了很久才恢复。你蹲下来:\"你生病的时候——我在舞台上。你好了——现在舞台上有你了。\"那个小女孩点点头。然后她对着你的耳朵小声说:\"你的歌——我每天化疗的时候都听。\"你不敢哭。但你握住她的手——很用力。","聋哑粉丝用手语比了你的名字。你学过一点——你用手语回了\"谢谢\"。她哭了。不是为了你会。是因为你学了——为了这一刻你学了很久。","海外签售——你试着用当地语言说了一句话。磕磕绊绊。粉丝在下面说\"不对的——这样——\"然后她教你。全场和她的声音说了一次。你笑着:\"被粉丝教外语——这体验独一份。\"","有人递来一封信——不是写给现在的你。是写给\"以后某天的你\"。你签了。日期写了三年后。\"三年后——如果你还记得——打开。\"","有个男粉跪下来——大家都吓了一跳。他从口袋里掏出的不是戒指——是一张写满了你歌词的本子。\"我求婚。不是婚——是求你把下一句歌词写完。这句我等了两年了。\"你笑了——然后你拿起笔——在上面写了一句。不是歌词。是\"谢谢。\"","签 音消息里笑了一下——然后沉默了两秒钟——说\"这个要是放进歌里，歌会好听的\"。你觉得那两秒就是你的舞台。"],"HIDDEN_ROUTE_POOL":["你在练习室里发现了一张纸条——夹在你放在镜子前的笔记本里——笔迹是他的——上面有一段和弦和一句歌词。你拿起来的时候纸张有点旧了——他用铅笔写的——好像不想让某人看——但是他没告诉你是谁。你看了和弦——记下来——然后放回了笔记本里——没有发给他。因为你认为那首还没有写好——而且你不知道他写的是不是你。","公司管理层调查练习室监控——说是\"检查设备\"——但是你从经纪人表情里读出来不是。晚上公司在内部群发了全员通知——禁止私下录制作品——没有指名——但是你知道他们看到什么了。手机锁屏暗了一下——他没有发消息。在暗的那一秒你觉得你们同时读懂同一封邮件——隔着三个楼层。","某次待机室里一位前辈突然坐到你旁边——不是你预约的——他只是路过顺便坐了几分钟。聊完之后他留了一张工作室名片。他说\"你迟早可以自己写——要是愿意——来我这儿编一天看看。\"后来你没告诉任何人那张名片——放得离你家钥匙很近。","你在看预告片的时候突然看到了自己——三秒——不是靠特效——是你在片场随手帮别人录的一段素材——被偷偷剪进了正片里——当预告。你在泡泡上发了一个问号——粉丝配文是\"这女人都不知道自己上了预告——笑死了\"。你看完回复之后其实知道——你不是不知道——是导演没说是你——他把你看成正片一部分。","一个已经离开圈子多年的前练习生突然造访你的公司——前台说\"他是来找你的\"。你跟他坐在楼下的咖啡店——临别时候他把一个旧U盘留给你——里面是你们以前共同填过词的几首歌。他说你再录的话——给一台钢琴就够。你听着回去的保姆车上插上耳机——歌很轻——轻得像还没决定停下来的雨。","你收到一份没有署名的曲谱——放在练习室的钢琴上——用很旧的五线谱纸写的。不是情歌——调式很怪——但是你把它按着琴键弹了一遍之后知道这一定是他写的——不是因为他写过一样的——是因为你想象过他想表达的——在这份谱里全出现了。","海外某位著名博主做了一个深度安利视频——关于你的——但是标题里把你放在了一个你没预料到的叙述框架里。你看了三十六分钟——全程没有暂停——看到结尾字幕组的\"Thank you for your music\"那行字——第一次有人在你的名字后面打上了这行字——你觉得如果以后谁会帮你写传记——那篇视频就够了。","有别的公司的人联系了你——不是透过经纪人——是私下。你看着那条消息——条件很好——比你现在的位置快两年。你截了图——没有回——然后把手机翻过来放在地板上——旁边是你今天在练习室穿的舞鞋。你看着那双鞋——知道了答案——不是因为忠诚——是那双鞋的颜色是你出道时站在你旁边的姐姐给你涂的。","你在专辑制作会议中用了之前自己写的那首歌——不用申请——因为编曲上改了一半——只有队友听出来那个和弦是同一轨。她在对面给你竖了个拇指——你低头看着录音表——上面没有作词作曲的署名——但是你在演唱note里写了一句话：用他给的第一个和弦。","导演给你发了一份私有链接——是MV的导演剪辑版——加了两分钟没用上的素材——是你录歌的时候不知道在拍的花絮。你看着监视器里做着自己的那个女生——那不是一个偶像——是一个在追效果的人——头发扎得不太整齐——但是唱到副歌时有一个低头——你看到导演剪辑落了字在那两秒——他说这是你身上最重要的镜头。"],"HIT_SONGS":["出道曲《Moonlight Letter》——中规中矩但粉丝情怀满满","小爆曲《Stay With Me》——曾进音源榜前30，综艺常被点名","抒情曲《Rainy Day》——被用作某韩剧OST后小范围出圈","夏日曲《Sugar High》——打歌舞台点击尚可，没能破圈","再出道曲《Echo》——概念反转尝试，圈内评价两极","逆行神曲《First Love》——发歌半年后突然逆袭回榜","电子风《Neon Sign》——夜店和短视频平台频繁使用","合作曲《Starlight》——与知名制作人合作，评论说你的音色被完美展现","芭蕾概念曲《Swan Song》——MV唯美到被国外YouTuber做reaction","校园三部曲终章《Graduation》——毕业季必听，每年三月翻红","复古Disco《Flashback》——90年代画质MV引发模仿热潮","城市Pop《Seoul City Lights》——首尔夜景为背景的MV","自作曲《写给粉丝的歌(Letter to {fandomName})》——粉丝名全写进歌词","日文版翻唱曲——给日本粉丝的惊喜礼物","中文版《星光》——发音标准中国粉丝暴哭","英文单曲《Fly》——首次挑 "],"MILESTONE_AWARDS":["你们被安排在同一段时间走红毯。你穿了一条你自己也觉得很美的裙子。他在你前面三组。签名的时候他回头看了你一眼——那一秒你被拍了，后来那张图转得最广。","你和他被提名了同一个新人奖。大屏幕上并列你们的照片。灯光打到你身上的时候你只敢看前方，余光里他在另一侧——一样在微笑。","你没有拿到奖。镜头切到你的时候你在鼓掌。微笑是完美的。他在获奖感言里提到了\"所有被提名的新人都是值得恭喜的\"。你觉得他有一部分话是在对你说。","你拿到奖了。感言的最后一句你说\"感谢一直支持我的所有人\"。然后你做了一个很小的、几乎看不见的手势——他在台下轻轻点头。","颁奖礼散场以后走廊很乱。到处都是艺人和工作人员。你在人群中看到他从另一个方向过来。没有人注意的时候他很快说了一句\"你今晚很漂亮\"。那个瞬间短得好像没发生过。","你们被提名为大赏候补。屏幕打出所有候选名单的那个画面——你的名字和人家的名字排在一起。你对自己说：就算没得奖，站到这里已经很好了。","终身成就奖。从你手里颁给一位前辈的时候，前辈握着你的手说\"以后这个奖也会是你的\"。你在台上差点哽咽。","导播把镜头切到你刚好是在他说话的时候——你正在看他。全国人民看到了。后来回放截图成了CP粉的镇圈图。你假装不知道。","你被安排在中场表演——第一次在这样的颁奖礼上表演。在后台准备的时候他在走廊抽烟区——不是抽烟，是在透气。他看到你，掐灭了手里打了半天没点着的烟。\"加油。\"你看着他。他说我只是想找人说句话。然后你才知道他今天也紧张——因为他也在颁奖礼上有表演。","红毯前你的礼服拉链卡住了。在去洗手间的走廊里遇到了他。你看他的眼神带着求救。他愣了一秒，然后极其专业地帮你拉好了。你们中间隔的距离刚好不会被任何人误会。但你闻到他的洗发水味道——用了很久的那个牌子你从来没忘过。","你在颁奖礼上戴着入耳式监听。中场休息的时候耳返里忽然传来一段很小的杂音——然后是一个短句。是你前几天发给他的语音。他把你的语音做成了采样放进今天的表演曲里。你在观众席捂住了嘴。","after party。DJ放了一首老歌。大家围着舞池。他被人群推到了你旁边。音乐很响——他低头在你耳边说了一句什么。你没听清，让他再说一遍。他说算了。但他嘴角弯起来的弧度你没有错过。"],"MILESTONE_DEBUT":["灯光亮起来的那一刻你觉得全世界都在看着你。腿在抖，但你告诉自己——不能退。后面是五个月的练习生生涯，前面是第一个舞台。你深吸一口气。","哥哥今天混在工作人员里来了后台。他把一块\"怀挺\"的贴纸贴在了你包上。你笑着说好土——后来那块贴纸你存了三年。","他在你上台前发了消息。你只看到预览——因为经纪人说\"手机关了\"。下台后你打开：他的消息躺在第一条。你站在走廊尽头哭了。不是因为他发了很多，是因为他只发了一句。","妈妈发了你的出道舞台链接给你，附加了一个😭的表情。你没有回复——因为你怕一回就会哭花眼妆。","你第一次在台上听到自己的团名被喊出来的时候——是粉丝的应援。声音不大，但是整齐的。你握话筒的手疼了一下。","上台前你在待机室的镜子前站了很久。队友一个个出去了——最后剩下你自己。你对着镜子对自己说了一句话。很久以后你还会记得这句话。","上台前，五个姐姐围成一个圈——把你拉进去。大姐说\"我们六个人，不管今天之后发生什么，都是六个人。\"你的眼泪在眼眶里转了一圈，被你憋回去了。","经纪人难得表情柔和。塞给你一瓶水说\"别紧张——你练了五年就是为了今天。\"你拧开瓶盖的时候手在抖，水洒了一点在衣服上。经纪人笑了。\"这很正常。\"","下台后你靠在走廊墙上喘气。一个扛着摄像机的老师傅路过，对你竖了个拇指。\"新人？不错——比很多老手都稳。\"你没有力气回话，只是用力点了点头。","回宿舍的车上没有人说话。每个人都在看手机——大概在刷自己出道舞台的评论。窗外的路灯一盏一盏往后退。你靠在车窗上，耳机里放的是今天你在台上唱的第一首歌。"],"MILESTONE_FIRST_WIN":["主持人念出你们团名的瞬间你听不见任何声音。队友拉着你的手在尖叫。你对着镜头——不知道该哭还是该笑。眼泪是自己出来的。","安可舞台。你边唱边哭。话筒好几次离嘴太远，但粉丝替你唱完了每一句。你在镜头里看到了自己哭肿的眼睛——但你觉得这是你最好看的画面。","他发了三个字：看到了。然后是一段空白——你等了好久。他最后说：我比你先拿一位，但你比我哭得久。你在回程的车上笑了好久。","团群聊炸了。哥哥连发了好多条感叹号，说爸妈在家看电视全看到了。你说你哭得很丑，哥说那才是最好看的。","奖杯被你带回了宿舍。放在床头。你睡觉前看了好几次——确认它不是梦。半夜醒来的时候看到它还在那里。你翻了个身又睡了。","你回放了自己的得奖瞬间——在每个角度、每个粉丝发的饭拍里。有一个饭拍刚好拍到台下一个角落里，他站了起来在鼓掌。不是全场鼓掌的时候——是宣布名字那瞬间。","拿到奖杯的那一刻你脑海里闪过的不是舞台——是练习生时期凌晨四点的练习室。那时候你不知道会不会出道，不知道会不会有粉丝。现在你握着一位奖杯。","经纪人哭了。这个带了你从练习生到现在的男人——第一次在你面前摘下眼镜擦了眼睛。他说没什么，就是眼睛里进了颁奖礼的灯光。你说嗯。但你也知道那不是灯光。","回程的车里所有人都在拿一位奖杯传着抱。车窗外面是夜晚的高速公路。有人放了一首你们自己的出道曲——全员跟唱，跑调跑到了天边。但那是你听过的最好听的版本。"],"MUSIC_SHOW_POOL":["MCD待机室——你的名字出现在电子屏上。你看了它的亮灯方式——和出道时一模一样。右下角的字：你的名字——是手写的风格。","音银打歌——刚出道时在同一天被同台的后辈cover了你们的歌。你在旁边看完了一整段。不是感动——是在听那段编曲里自己唱过的part。然后你也张了嘴——没有出声。但你知道你在跟着。","人歌末放——你在ending镜头里比了无声的\"谢谢\"。只有你自己知道是给谁的。","音中——你穿着全白打歌服。灯光打在衣服上反射到你脸上。站哥的镜头拍到这个瞬间——那张图后来被选了这天的best HD。","The Show——小台也有小台的好——观众席离舞台特别近。你能看到第一排每一个人的表情。你唱到一半看到一个粉丝在哭。不是激动——是安静地掉泪。你对着她轻轻点了一下头。她哭得更凶了。","Show Chanpion预录——你和最小的队友在候场区的长椅上挨着睡了一排。站姐拍了那张照片——六个人挤在一起，盖同一件羽绒服。\"今天最早的一张图。\"","MCD一位候补——宣布结果时你的手攥紧了队友的。不是你们。但你第一反应是鼓掌——为对方鼓掌。镜头切走时你的下巴在发抖。","音银上班路——你在车上看粉丝的应援牌看到出神。队友拍你肩膀:\"下车了。\"你说:\"在看她写的——她说我是她的第二十年。\"那个粉丝大概二十岁。你也是。","人歌——今天的编舞有一个回头。你在排练时每次都转不稳。正式时——你转了。站住了。然后你在ending镜头里轻轻吐了一口气。","音中今天舞台——你的打歌服是改良韩服。紫色配银色。造型师说\"像花在开。\"你说更像飞蛾——等着灯。","The Show打歌——耳返掉了。你用左手一直按着跳完整首。没有人发现——除了队友。她在换位时悄悄帮你按回去了。一气呵成。","Champion一位——奖杯被最小的队友抢过去举了。你对着镜头哭到说不出话。她替你说了全部感言。然后你抱住了她的腰——把她的打歌服哭湿了。","MCD——今天的打歌服里有一件粉丝送的手作。不是大牌。你穿着它在镜头前转了三次。那件衣服被放大了无数张截图。","音银打歌结束你最后一个离开舞台。你在台上踩了一下那道光。出道前你在这个位置看过前辈的舞台——\"有一天——这里也要站我。\"你蹲下拍了拍地板:\"我到了。\"","人歌——生放送中你的麦克风坏了。声音传不出去。你用尽了全部肺活量。后排粉丝说能听到你裸声。PD要重录。你说不用——\"她们说听到了。\"","MCD回归初放——你在后台把护身符放在化妆台旁边。不是第一次了——从出道showcase那场开始。你每次回归都带着。","音银上下班路下着雨——你看到有粉丝没带伞。你把车窗摇下来:\"快回去——\"\"我们等你走了再走。\"然后她们真的等你的车消失在转口。你在后视镜里看到她们还站在原地。然后你拿起了伞——不是要下车。是想替她们撑。","人歌安可舞台——你们拿了今天的第一。安可时唱到一半你破了音。但台下都在唱。你的破音被几千人的声音盖住了。你第一次觉得破音不可怕。","音中下班路——你在车窗上哈气写字:谢谢。外面天色很黑。下面有粉丝举着灯——她们读到了。然后回在你车窗对面写了两个字。你认出来了:也是谢谢。不是哈气写的——是举板。","The Show——今天有个才出道两周的后辈团来打招呼。你看到她们的眼睛——和你们当初一模一样。\"别紧张——\"\"前辈我们好喜欢你。\"\"谢谢。你们也会被喜欢的。\"你在她们手机壳后面贴了一张你的贴纸。不是宣传——是祝福。"],"MV_FILMING_POOL":["录音室里你在录最后一句。制作人隔了玻璃对你竖起拇指——你觉得是\"过了\"的意思——但是他叫你再录一遍——更轻——比说情话还轻。第三次的时候你看着歌词的眼睛有点热——不是舞台上的那种燃烧——是录音棚里没有观众的、自己的那种。","MV外景拍摄——温度三度——下雨了。你穿着春装在镜头前假装温暖。导演喊卡的时候你还没有走—— 字。你私信他问\"这是...？\"他说\"就是你听到的那个意思。\"","团内成员说在录音室有一个demo想让你听听——说是\"需要女声的意见\"。你去了才发现录音室里只有他一个人。他说\"别人都走了\"。你站在门口犹豫了一下。","团内成员送了你一副贵重的耳返。\"上次看到你耳返有杂音。这个是定制的——和你音域匹配。\"你不知道该收还是不该收。他说\"先试试，不喜欢就退。\"你知道退不了。","待机室里你在弄背后的拉链够不到。团内成员正好进来——没有问，只是走过来帮你拉上了。手指在你后背停留了两秒。你回头的时候他已经在看别处了。","他的演唱会上，导播忽然把镜头切到了你——你在大屏幕上愣了一下。全场尖叫。他在台上对你笑了笑——那个笑不是营业的。你旁边队友戳了你一下说\"今天你比他更火。\""],"ROMANCE_BACKSTAGE":["你在走廊拐角差点撞上他——两个人都后退了一步。他说\"你先走\"，你没动。空气安静了两秒。","你推开待机室门的时候发现他正靠在对面墙上。他说\"我只是刚好路过\"。但你看到他的耳返线还在脖子上——明显是刚下台。","彩排的时候你注意到台下多了一个人。他坐在第三排最左边——那个位置灯光刚好打不到。但你认得那个坐姿。","化妆间只有你一个人。门开了——他探头进来说\"走错了\"。但你看到他的眼神在你镜子里停了一秒。","今天两团都有录制。你在走廊的长椅上坐着发呆，他突然从转角出来，手里端着一杯咖啡。他看见你，犹豫了一下，把咖啡放在了你旁边。","你耳返线缠住了，在后台楼梯间一个人跟线较劲。他经过说\"你这样会越扯越紧\"。然后蹲下来帮你解开了。手指碰了你一下。","电梯门开了——他在里面。你犹豫了一下还是走了进去。电梯从3楼到1楼大约15秒。谁都没有说话。但你觉得15秒从来没这么长过。","工作人员把你的化粧间号和男团的安排混了。你推门进去的时候他正在换衣服。两个人同时愣住了。你关门比开门还快。","今天你是最后一个离开放送局的。往停车场走的时候看到一个人站在路灯下——是他。他说\"我也最后一个\"。你们一起走了一段路。","下雨。你没带伞，站在门口犹豫。他从后面走出来，把伞递给你，自己把外套帽子拉上了。\"明天还我。\"然后走进了雨里。","你在待机室找不到自己的水瓶。后来在走廊看到他手里拿着一瓶跟你一样牌子的——标签上写着你名字的首字母。他说\"我以为是自己的\"。你的耳朵红了。","音乐中心录制。你在侧台等自己的顺序。他从另一边侧台冒出来——今天他穿了西装。你瞥了一眼又移开视线，但他已经看见了。","深夜排练结束后自动贩卖机前面站着两个人——你和他是今晚最后离开的两组艺人。他投了币。可乐掉出来的时候他递给了你。","回看舞台监视器的时候发现他在你身后。你们的舞台刚好连着。他在监视器里看到你的时候说了句\"这个角度...不错\"。你不知道他在说舞台还是你。","你在舞台服装口袋里找到一颗糖。不记得什么时候放进去的。下午遇到他的时候他说\"好吃吗\"。你愣了三秒才反应过来。","两团的造型师共用一间工作室。你去试衣服的时候他的衣服还挂在旁边——是今天打歌的西装。你的手指不小心碰到了那件西装的袖口。","电台节目的休息间。你们被安排在同一个房间等待——中间只隔了一张桌子。你盯着桌上那盆绿植，他盯着手机。谁都没先开口，但空气里全是未读消息。","大楼消防演练。所有人都被疏散到停车场。你站在人群里，忽然有人轻轻站到了你旁边——熟悉的洗衣液味道。他说这演练每年都一样，你没接话，但他肩膀离你近了一指。","颁奖典礼的后台到处都是人。你在人群中被人流推着往前，差点撞上前面的人——是你。他回头看到是你，嘴角动了一下。那一下被他经纪人的催促打断了。但你已经看到了。","今天后台化妆间不够用，两团被安排共用一面大镜子。你在镜子里看到他坐在另一头——他也看到了你。你们就这样隔着一排化妆台在镜子里对视了两秒。"],"ROMANCE_CONFESSION":["天台晚上只有你们两个人。他看着你说\"有件事我想了很久\"。风吹过来吹散了话语。你听清了每一个字。","他终于开口了——话到一半，经纪人的电话响了。他对手机说\"现在没空\"。挂断的时候那句话还悬在半空。他又重新说了一遍。","练习室里灯只剩一半。你坐在地上靠着镜子，他坐在离你一臂远的地方。\"你知道我第一次注意到你是什么时候吗？\"你没回答。他说的那个瞬间你根本不记得——原来从那时候就开始了。","今天你拿到了第一个一位。庆功宴结束后他出现在停车场。没有祝贺的话——他说了一句别的。你用奖杯遮住了整张脸。","他发了一段demo过来。歌词里有一句——你没有听过。但你觉得那句写的是你们。你问他\"这歌是...\"他说\"写给你的。\"","下雨天，他送你回宿舍     if(STATE.traineePhase===2&&POOLS.TRAINEE_MID_POOL)pp=POOLS.TRAINEE_MID_POOL;
    if(STATE.traineePhase===3&&POOLS.TRAINEE_LATE_POOL)pp=POOLS.TRAINEE_LATE_POOL;
    if(pp)evts.push({label:"日程",text:short(pick(pp),80)});
  }else{
    var chMaps={1:"CHAPTER1_NOVICE",2:"CHAPTER2_SPROUTING",3:"CHAPTER2_RISING",4:"CHAPTER3_PEAK",5:"CHAPTER5_TOPSTAR",6:"CHAPTER4_LEGEND"};
    var chP=POOLS[chMaps[STATE.chapter]]||[];
    var mainP=Math.random()<0.7?chP:(POOLS.COMMON_POOL||[]);
    if(mainP.length)evts.push({label:"日程",text:short(pick(mainP),80)});
    if(POOLS.RELATED_POOL&&POOLS.RELATED_POOL.length)evts.push({label:"关联",text:short(pick(POOLS.RELATED_POOL),60)});
    if(POOLS.FAN_LETTER_POOL&&POOLS.FAN_LETTER_POOL.length)evts.push({label:"粉丝",text:short(pick(POOLS.FAN_LETTER_POOL),70)});
  }
  var checks=[
    {p:"BROTHER_EVENT_POOL",t:"哥哥",r:0.12},{p:"MALE_LEAD_INITIATIVE_POOL",t:"男主",r:0.08},
    {p:"JEALOUSY_EVENTS_POOL",t:"吃醋",r:STATE.affection>=20?0.12:0},
    {p:"RIVAL_ADVANCE_EVENTS",t:"情敌",r:STATE.affection>=10?0.10:0},
    {p:"HEALTH_INJURY_POOL",t:"伤病",r:0.08},{p:"TEAMMATE_BOND_POOL",t:"队友",r:0.10},
    {p:"TOXIC_FAN_WAR_POOL",t:"毒唯",r:STATE.popularity>=20?0.12:0},
    {p:"GIRLGROUP_EVENTS",t:"女团",r:isD?0.18:0},
    {p:"INDUSTRY_EVENTS",t:"行业",r:isD?0.12:0},
    {p:"JOB_GRADE_POOL",t:"通告",r:isD&&STATE.popularity>=15?0.15:0},
    {p:"PRESS_INTERVIEW_POOL",t:"采访",r:isD&&STATE.popularity>=20?0.10:0},
    {p:"MV_FILMING_POOL",t:"MV",r:isD&&STATE.popularity>=25?0.08:0},
    {p:"HIDDEN_ROUTE_POOL",t:"隐藏",r:isD&&STATE.popularity>=25?0.05:0},
    {p:"CHEER_CULTURE_POOL",t:"应援",r:isD&&STATE.popularity>=10?0.15:0},
    {p:"HIATUS_ANXIETY_POOL",t:"空白",r:isD?0.12:0},
    {p:"DATING_SCANDAL_CHAIN",t:"绯闻",r:isD&&STATE.affection>=40?0.08:0},
    {p:"VARIETY_MOMENT_POOL",t:"名场面",r:isD&&STATE.popularity>=20?0.10:0}
  ];
  for(var ci=0;ci<checks.length;ci++){
    var c=checks[ci];if(Math.random()<c.r&&POOLS[c.p]&&POOLS[c.p].length)
    evts.push({label:c.t,text:short(pick(POOLS[c.p]),60)})
  }
  return evts;
}

function sceneHints(){
  var aff=STATE.affection,hints=[];
  var sp=[
    {p:"ATMOSPHERE_WEATHER",l:"天气"},{p:"ATMOSPHERE_MOOD",l:"心情"},{p:"ATMOSPHERE_HIS_STATE",l:"男主"},
    {p:"ROMANCE_BACKSTAGE",l:"后台",r:aff>=20},{p:"ROMANCE_LATENIGHT",l:"深夜",r:aff>=20},{p:"ROMANCE_PUBLIC",l:"公共",r:aff>=20},
    {p:"ROMANCE_CRISIS",l:"危机",r:aff>=40},{p:"ROMANCE_JEALOUSY_POOL",l:"吃醋",r:aff>=30},{p:"ROMANCE_CONFESSION",l:"告白",r:aff>=60},
    {p:"SECRET_COMMS",l:"通讯",r:aff>=30&&STATE.exposure>=10},{p:"SECRET_NEARMISS",l:"暴露",r:aff>=30&&STATE.exposure>=10},
    {p:"SECRET_FAN_CLUES",l:"线索",r:aff>=30&&STATE.exposure>=10},{p:"SECRET_COMPANY",l:"公司",r:aff>=30&&STATE.exposure>=10},
    {p:"ENCOUNTER_ML",l:"偶遇男主",r:aff>=20},{p:"ENCOUNTER_RIVAL",l:"偶遇情敌",r:aff>=20},{p:"ENCOUNTER_BROTHER",l:"哥哥",r:aff>=20},
    {p:"ENCOUNTER_OTHERS",l:"起哄",r:aff>=30},
    {p:"DRAMA_ALMOST",l:"差点告白",r:aff>=50},{p:"DRAMA_MISUNDERSTAND",l:"误会",r:aff>=30},{p:"DRAMA_COLDWAR",l:"冷战",r:aff>=40},
    {p:"DRAMA_DATING_RUMOR",l:"绯闻",r:aff>=40},{p:"DRAMA_DILEMMA",l:"二选一",r:aff>=50},
    {p:"MILESTONE_AWARDS",l:"颁奖",r:STATE.isDebut},{p:"MILESTONE_FIRST_WIN",l:"一位",r:STATE.isDebut&&STATE.chapter>=2},
    {p:"MILESTONE_DEBUT",l:"出道",r:STATE.isDebut&&STATE.chapter<=1},{p:"CALENDAR_EVENTS",l:"日历"}
  ];
  for(var si=0;si<sp.length;si++){
    var s=sp[si];if(s.r===false)continue;
    if(POOLS[s.p]&&POOLS[s.p].length){
      var txt=pick(POOLS[s.p]);if(txt)hints.push("["+s.l+"] "+short(txt,100));
    }
  }
  return hints;
}

function newDayProc(){
  if(!STATE.isDebut){
    STATE.traineeDay=(STATE.traineeDay||0)+1;
    STATE.traineePhase=STATE.traineeDay<=4?1:STATE.traineeDay<=10?2:3;
    if(STATE.traineePhase===3){
      STATE.debutC=(STATE.debutC||0)+1;
      if(STATE.debutC>=2+Math.floor(Math.random()*3)){STATE.isDebut=true;STATE.popularity=0;}
    }
  }
}

window.nextRound=function(optIdx){
  ROUND++;slot++;
  if(slot>=3){slot=0;STATE.dayCount++;STATE.gameDay++;newDayProc();}
  var deltas=[2,0,-1];
  STATE.affection=Math.max(0,Math.min(100,STATE.affection+deltas[optIdx]));
  if(STATE.isDebut&&Math.random()<0.45)STATE.popularity=Math.min(100,STATE.popularity+1);
  var tCh=popToCh(STATE.popularity);
  if(tCh>STATE.chapter){STATE.chapter=tCh;var sk={2:30,3:45,4:60,5:75,6:90}[tCh]||0;if(sk)STATE.dayCount+=sk;}
  if(STATE.isDebut&&STATE.affection>=15)STATE.exposure=Math.min(100,STATE.exposure+0.3+Math.random()*0.7);
  if(ROUND>=TOTAL){gameOver();return}render();
};

window.skip10=function(){for(var i=0;i<10&&ROUND<TOTAL;i++)window.nextRound(Math.floor(Math.random()*3))};
window.skipToEnd=function(){while(ROUND<TOTAL)window.nextRound(Math.floor(Math.random()*3))};

function gameOver(){
  document.getElementById("app").innerHTML=
    '<div class="overlay"><div class="overlay-box"><h2>200轮完成！</h2>'+
    '<p>好感: <b>'+STATE.affection+'</b>/100</p>'+
    '<p>人气: <b>'+STATE.popularity+'</b></p>'+
    '<p>章节: <b>Ch'+STATE.chapter+' '+CHAPTER_NAMES[STATE.chapter]+'</b></p>'+
    '<p>日历: <b>'+STATE.dayCount+'</b>天 | 游戏: <b>'+STATE.gameDay+'</b>天</p>'+
    '<button onclick="location.reload()">重新开始</button></div></div>';
}

function render(){
  var aff=STATE.affection,pop=STATE.popularity,ch=STATE.chapter;
  var label=STATE.isDebut?"已出道":"练习生·"+(STATE.traineePhase===1?"前期":STATE.traineePhase===2?"中期":"后期");
  var hints=sceneHints();
  var hShuff=hints.slice().sort(function(){return Math.random()-0.5});
  var picked=hShuff.slice(0,Math.min(4,hints.length));
  var mood=aff<10?"紧张又期待":aff<20?"渐渐习惯练习生活":aff<40?"心里有了一点秘密":aff<60?"每次见面都像在打歌":aff<80?"已经不能没有他":"想把这份感情藏在聚光灯照不到的地方";
  var locs=["练习室","待机室","保姆车上","公司走廊","宿舍","咖啡店","便利店","天台","录音棚"];
  var nar=PHASES[slot]+" · Day"+STATE.dayCount+" · 第"+(ROUND+1)+"轮\n\n";
  nar+=label+" · 人气"+pop+"\n\n";
  nar+=pick(locs)+"。你站在这里——"+mood+"。\n\n";
  nar+="场景素材:\n"+picked.join("\n");

  var h='<div class="top-bar">';
  h+='<span class="stat">好感 <b>'+aff+'</b></span>';
  h+='<span class="stat">人气 <b>'+pop+'</b></span>';
  h+='<span class="stat">曝光 <b>'+(STATE.exposure||0).toFixed(0)+'</b></span>';
  h+='<span class="stat"> <b>'+(aff>=60?"明确期":aff>=20?"暧昧期":"初识")+'</b></span>';
  h+='<span class="chapter-badge">Ch'+ch+' '+CHAPTER_NAMES[ch]+'</span>';
  h+='<span class="stat">#'+(ROUND+1)+'/'+TOTAL+'</span>';
  h+='</div>';
  h+='<div class="narrative">'+nar.replace(/\n/g,'<br>')+'</div>';
  h+='<div class="options">';
  h+='<button class="option-btn" onclick="nextRound(0)"><span class="tag">选项1</span> 继续专注今天的练习和日程</button>';
  h+='<button class="option-btn" onclick="nextRound(1)"><span class="tag">选项2</span> 和队友随便聊聊日常</button>';
  h+='<button class="option-btn" onclick="nextRound(2)"><span class="tag">选项3</span> 给某人编辑一条消息...然后删掉</button>';
  h+='</div>';

  var devts=dailyEvents();
  if(devts.length){
    h+='<div class="events-bar">';
    for(var di=0;di<Math.min(devts.length,6);di++){
      h+='<span>'+devts[di].label+': '+devts[di].text+'</span>';
    }
    h+='</div>';
  }
  h+='<div class="bottom-controls">';
  h+='<button class="btn-skip" onclick="skip10()">跳过10轮</button>';
  h+='<button class="btn-skip" onclick="skipToEnd()">跳到结局</button>';
  h+='</div>';

  document.getElementById("app").innerHTML=h;
}

render();
</script>
</body>
</html>
